<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <title>PDF Slideshow</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            position: fixed;
            inset: 0;
        }

        /* Force landscape on mobile via CSS rotation */
        .app-container {
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* Portrait mode: rotate the entire app */
        @media (orientation: portrait) {
            .app-container {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: top left;
                position: absolute;
                top: 0;
                left: 100vw;
            }
        }

        /* Loader */
        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .loader-ring {
            width: 36px; height: 36px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .loader-text {
            color: rgba(255,255,255,0.35);
            font-size: 12px; font-weight: 500;
            letter-spacing: 2px; text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Slides Wrapper */
        .slides-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .page-stack {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Stack Card */
        .stack-card {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform, opacity;
            overflow: hidden;
        }

        /* Video Card */
        .stack-card.video-card {
            width: 100%;
            height: 100%;
        }

        .stack-card.video-card video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .scroll-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
        }

        .scroll-hint svg {
            width: 14px; height: 14px;
            stroke: rgba(255,255,255,0.3);
            stroke-width: 2; fill: none;
            animation: hintPulse 2s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 1; transform: translateX(4px); }
        }

        /* PDF Card */
        .stack-card.pdf-card {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pdf-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        .pdf-zoom-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            will-change: transform;
        }

        .stack-card.pdf-card canvas {
            max-width: calc(100% - 20px);
            max-height: calc(100% - 20px);
            width: auto;
            height: auto;
            background: #fff;
            box-shadow: 0 2px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* Horizontal stack positions */
        .stack-card.prev-3, .stack-card.hidden-left {
            transform: translateX(-120%) scale(0.8);
            opacity: 0; pointer-events: none; z-index: 0;
        }
        .stack-card.prev-2 {
            transform: translateX(-8%) scale(0.90);
            opacity: 0.12; filter: brightness(0.35);
            z-index: 2; pointer-events: none;
        }
        .stack-card.prev-1 {
            transform: translateX(-4%) scale(0.95);
            opacity: 0.25; filter: brightness(0.45);
            z-index: 3; pointer-events: none;
        }
        .stack-card.current {
            transform: translateX(0) scale(1);
            opacity: 1; filter: none; z-index: 10;
        }
        .stack-card.next-1 {
            transform: translateX(4%) scale(0.95);
            opacity: 0.25; filter: brightness(0.45);
            z-index: 3; pointer-events: none;
        }
        .stack-card.next-2 {
            transform: translateX(8%) scale(0.90);
            opacity: 0.12; filter: brightness(0.35);
            z-index: 2; pointer-events: none;
        }
        .stack-card.next-3, .stack-card.hidden-right {
            transform: translateX(120%) scale(0.8);
            opacity: 0; pointer-events: none; z-index: 0;
        }

        /* Page Counter */
        .page-counter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px 16px;
            border-radius: 980px;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 2px;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }
        .page-counter.visible { opacity: 1; }
        .page-counter .current-num { color: #fff; font-weight: 700; }
        .page-counter .sep { color: rgba(255,255,255,0.3); margin: 0 2px; }
        .page-counter .total-num { color: rgba(255,255,255,0.5); }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            top: 0; left: 0;
            height: 2px;
            background: rgba(255,255,255,0.5);
            z-index: 100;
            transition: width 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            opacity: 0;
            pointer-events: none;
        }
        .progress-bar.visible { opacity: 1; }

        /* Zoom Controls */
        .zoom-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 10px;
            padding: 4px;
            gap: 2px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .zoom-controls.visible { display: flex; }

        .zoom-btn {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.08);
            border: none; border-radius: 8px;
            color: #fff; font-size: 16px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-weight: 300;
            touch-action: manipulation;
        }
        .zoom-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }

        .zoom-level {
            min-width: 40px; text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 10px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .zoom-reset {
            font-size: 10px; padding: 0 8px;
            font-weight: 600;
        }

        /* Upload Container */
        .upload-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            background: #000;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .upload-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .upload-content {
            max-width: 340px;
            width: 100%;
            text-align: center;
            color: #fff;
        }
        .upload-content h2 {
            font-size: 22px; font-weight: 700;
            letter-spacing: -0.02em; margin-bottom: 6px;
        }
        .upload-content > p {
            color: rgba(255,255,255,0.4);
            font-size: 13px; margin-bottom: 24px; line-height: 1.4;
        }
        .upload-area {
            background: rgba(255,255,255,0.04);
            border: 1.5px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 36px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.drag-over {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.3);
            border-style: solid;
        }
        .upload-icon { font-size: 40px; margin-bottom: 12px; }
        .upload-area p {
            color: rgba(255,255,255,0.4);
            font-size: 13px; margin-bottom: 16px;
        }
        .upload-btn {
            display: inline-block; padding: 10px 28px;
            background: #0a84ff; color: #fff; border: none;
            border-radius: 980px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .upload-btn:active { transform: scale(0.95); }
        input[type="file"] { display: none; }

        .status {
            margin-top: 16px; padding: 10px 16px;
            border-radius: 12px; font-size: 13px; display: none;
        }
        .status.loading { background: rgba(255,255,255,0.05); color: #fff; display: block; }
        .status.error { background: rgba(255,59,48,0.15); color: #ff453a; display: block; }

        /* Touch Area */
        .touch-area {
            position: absolute;
            inset: 0;
            z-index: 50;
            touch-action: none;
        }
        .touch-area.zoom-active { pointer-events: none; }

        /* Rotate prompt for very small portrait screens */
        .rotate-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            color: #fff;
        }

        .rotate-prompt .rotate-icon {
            width: 60px; height: 60px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        .rotate-prompt .rotate-icon svg {
            width: 32px; height: 32px;
            stroke: rgba(255,255,255,0.6);
            stroke-width: 1.5; fill: none;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-90deg); }
            50% { transform: rotate(-90deg); }
            75% { transform: rotate(0deg); }
        }

        .rotate-prompt p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            text-align: center;
            max-width: 200px;
            line-height: 1.4;
        }

        .rotate-prompt .dismiss-btn {
            margin-top: 8px;
            padding: 8px 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 980px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }
        .rotate-prompt .dismiss-btn:active { background: rgba(255,255,255,0.2); }

        /* Zoom hint */
        .zoom-hint {
            display: none;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(16px);
            padding: 8px 16px;
            border-radius: 980px;
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            font-weight: 500;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.08);
            animation: toastAnim 3s ease-in-out forwards;
            white-space: nowrap;
            pointer-events: none;
        }
        .zoom-hint.visible { display: block; }

        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
        }

        /* Nav dots - left side vertical */
        .nav-dots {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 6px 3px;
        }
        .nav-dots.visible { opacity: 1; }

        .nav-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }
        .nav-dot:active { transform: scale(1.5); }
        .nav-dot.active {
            background: #fff;
            transform: scale(1.3);
            box-shadow: 0 0 6px rgba(255,255,255,0.4);
        }
        .nav-dot.video-dot { background: rgba(255,55,95,0.3); }
        .nav-dot.video-dot.active {
            background: #ff375f;
            box-shadow: 0 0 6px rgba(255,55,95,0.5);
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
    </div>

    <!-- Rotate Prompt (optional, dismissed) -->
    <div class="rotate-prompt" id="rotatePrompt">
        <div class="rotate-icon">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
        <p>For the best experience, rotate your phone to landscape</p>
        <button class="dismiss-btn" id="dismissRotate">Continue anyway</button>
    </div>

    <div class="app-container" id="appContainer">
        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar"></div>

        <!-- Nav Dots -->
        <div class="nav-dots" id="navDots"></div>

        <!-- Page Counter -->
        <div class="page-counter" id="pageCounter">
            <span class="current-num">1</span>
            <span class="sep">/</span>
            <span class="total-num">1</span>
        </div>

        <!-- Zoom Controls -->
        <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" id="zoomOut">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomIn">+</button>
            <button class="zoom-btn zoom-reset" id="zoomReset">Reset</button>
        </div>

        <!-- Zoom Hint -->
        <div class="zoom-hint" id="zoomHint">Pinch to zoom · Double-tap to reset</div>

        <!-- Upload -->
        <div class="upload-container" id="uploadContainer">
            <div class="upload-content">
                <h2>PDF Slideshow</h2>
                <p>Upload your PDF to begin</p>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <p>Drop PDF here or tap below</p>
                    <input type="file" id="fileInput" accept=".pdf">
                    <label for="fileInput" class="upload-btn">Choose File</label>
                </div>
                <div id="status"></div>
            </div>
        </div>

        <!-- Slides -->
        <div class="slides-wrapper" id="slidesWrapper">
            <div class="page-stack" id="pageStack">
                <!-- Video Card -->
                <div class="stack-card video-card current" data-index="0" id="videoCard">
                    <video id="mainVideo" autoplay muted loop playsinline preload="auto">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="scroll-hint" id="scrollHint">
                        <span>Swipe</span>
                        <svg viewBox="0 0 24 24"><polyline points="9,6 15,12 9,18"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Touch Area -->
        <div class="touch-area" id="touchArea"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            currentIndex: 0,
            totalCards: 1,
            isAnimating: false,
            pdfDoc: null,
            renderedPages: new Map(),
            zoom: {
                scale: 1, minScale: 1, maxScale: 5,
                translateX: 0, translateY: 0,
                isZoomed: false, isPinching: false,
                startDistance: 0, startScale: 1
            }
        };

        const el = {
            loader: document.getElementById('loader'),
            appContainer: document.getElementById('appContainer'),
            progressBar: document.getElementById('progressBar'),
            navDots: document.getElementById('navDots'),
            pageCounter: document.getElementById('pageCounter'),
            uploadContainer: document.getElementById('uploadContainer'),
            pageStack: document.getElementById('pageStack'),
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            status: document.getElementById('status'),
            touchArea: document.getElementById('touchArea'),
            video: document.getElementById('mainVideo'),
            videoCard: document.getElementById('videoCard'),
            scrollHint: document.getElementById('scrollHint'),
            zoomControls: document.getElementById('zoomControls'),
            zoomLevel: document.getElementById('zoomLevel'),
            zoomIn: document.getElementById('zoomIn'),
            zoomOut: document.getElementById('zoomOut'),
            zoomReset: document.getElementById('zoomReset'),
            zoomHint: document.getElementById('zoomHint'),
            rotatePrompt: document.getElementById('rotatePrompt'),
            dismissRotate: document.getElementById('dismissRotate')
        };

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                         ('ontouchstart' in window);

        // Try to lock orientation to landscape
        function tryLockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }
        tryLockLandscape();

        // Dismiss rotate prompt
        el.dismissRotate.addEventListener('click', () => {
            el.rotatePrompt.style.display = 'none';
        });

        // Helpers
        function getDistance(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        }
        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

        // Get effective dimensions (considering rotation)
        function getEffectiveDimensions() {
            const isPortrait = window.innerHeight > window.innerWidth;
            if (isPortrait) {
                // Rotated: width becomes height and vice versa
                return { width: window.innerHeight, height: window.innerWidth };
            }
            return { width: window.innerWidth, height: window.innerHeight };
        }

        // Nav Dots
        function createNavDots() {
            el.navDots.innerHTML = '';
            for (let i = 0; i < state.totalCards; i++) {
                const dot = document.createElement('div');
                dot.className = `nav-dot ${i === 0 ? 'video-dot' : ''} ${i === state.currentIndex ? 'active' : ''}`;
                dot.addEventListener('click', (e) => { e.stopPropagation(); goToCard(i); });
                dot.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); goToCard(i); }, { passive: false });
                el.navDots.appendChild(dot);
            }
        }

        // Update UI
        function updateUI() {
            const dots = el.navDots.querySelectorAll('.nav-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === state.currentIndex));

            const progress = state.totalCards > 1 ? (state.currentIndex / (state.totalCards - 1)) * 100 : 0;
            el.progressBar.style.width = `${progress}%`;

            const cur = el.pageCounter.querySelector('.current-num');
            const tot = el.pageCounter.querySelector('.total-num');
            if (state.currentIndex > 0) {
                cur.textContent = state.currentIndex;
                tot.textContent = state.totalCards - 1;
            } else {
                cur.textContent = '▶';
                tot.textContent = state.totalCards - 1;
            }

            el.zoomControls.classList.toggle('visible', state.currentIndex > 0);

            if (el.scrollHint) {
                el.scrollHint.style.display = state.currentIndex === 0 && state.totalCards > 1 ? 'flex' : 'none';
            }

            updateCardStack();
        }

        function updateCardStack() {
            const cards = el.pageStack.querySelectorAll('.stack-card');
            const cls = ['prev-3','prev-2','prev-1','current','next-1','next-2','next-3','hidden-left','hidden-right'];

            cards.forEach(card => {
                const idx = parseInt(card.dataset.index);
                const diff = idx - state.currentIndex;
                cls.forEach(c => card.classList.remove(c));

                if (diff === 0) card.classList.add('current');
                else if (diff === -1) card.classList.add('prev-1');
                else if (diff === -2) card.classList.add('prev-2');
                else if (diff <= -3) card.classList.add('hidden-left');
                else if (diff === 1) card.classList.add('next-1');
                else if (diff === 2) card.classList.add('next-2');
                else card.classList.add('hidden-right');
            });

            if (state.currentIndex === 0) {
                el.video?.play().catch(() => {});
            } else {
                el.video?.pause();
            }
        }

        // Zoom
        function resetZoom() {
            state.zoom.scale = 1;
            state.zoom.translateX = 0;
            state.zoom.translateY = 0;
            state.zoom.isZoomed = false;
            state.zoom.isPinching = false;
            el.zoomLevel.textContent = '100%';
            el.touchArea.classList.remove('zoom-active');
            document.querySelectorAll('.pdf-zoom-wrapper').forEach(w => {
                w.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
                w.style.transform = 'scale(1) translate(0px, 0px)';
                setTimeout(() => { w.style.transition = ''; }, 300);
            });
        }

        function applyZoom() {
            const wrapper = document.querySelector(`.stack-card[data-index="${state.currentIndex}"] .pdf-zoom-wrapper`);
            if (!wrapper) return;
            if (state.zoom.scale <= 1) {
                state.zoom.translateX = 0;
                state.zoom.translateY = 0;
            } else {
                const maxTX = (state.zoom.scale - 1) * wrapper.offsetWidth / 2;
                const maxTY = (state.zoom.scale - 1) * wrapper.offsetHeight / 2;
                state.zoom.translateX = clamp(state.zoom.translateX, -maxTX, maxTX);
                state.zoom.translateY = clamp(state.zoom.translateY, -maxTY, maxTY);
            }
            wrapper.style.transform = `scale(${state.zoom.scale}) translate(${state.zoom.translateX / state.zoom.scale}px, ${state.zoom.translateY / state.zoom.scale}px)`;
            el.zoomLevel.textContent = `${Math.round(state.zoom.scale * 100)}%`;
            state.zoom.isZoomed = state.zoom.scale > 1.05;
            el.touchArea.classList.toggle('zoom-active', state.zoom.isZoomed);
        }

        // Navigate
        function goToCard(index) {
            if (state.isAnimating) return;
            if (index < 0 || index >= state.totalCards || index === state.currentIndex) return;
            resetZoom();
            state.isAnimating = true;
            state.currentIndex = index;
            updateUI();
            if (state.pdfDoc) {
                [index - 1, index, index + 1, index + 2].forEach(p => renderPage(p));
            }
            setTimeout(() => { state.isAnimating = false; }, 500);
        }

        // Render PDF
        async function renderPage(pageNum) {
            if (!state.pdfDoc || pageNum < 1 || pageNum > state.pdfDoc.numPages) return;
            const dim = getEffectiveDimensions();
            const maxW = dim.width - 20;
            const maxH = dim.height - 20;
            const cacheKey = `${pageNum}-${maxW}-${maxH}-${window.devicePixelRatio}`;
            if (state.renderedPages.get(pageNum) === cacheKey) return;

            try {
                const page = await state.pdfDoc.getPage(pageNum);
                const card = el.pageStack.querySelector(`.stack-card[data-index="${pageNum}"]`);
                if (!card) return;

                let zc = card.querySelector('.pdf-zoom-container');
                if (!zc) {
                    zc = document.createElement('div');
                    zc.className = 'pdf-zoom-container';
                    const zw = document.createElement('div');
                    zw.className = 'pdf-zoom-wrapper';
                    zc.appendChild(zw);
                    card.appendChild(zc);
                }
                const zw = card.querySelector('.pdf-zoom-wrapper');
                let canvas = zw.querySelector('canvas');
                if (!canvas) { canvas = document.createElement('canvas'); zw.appendChild(canvas); }

                const ctx = canvas.getContext('2d');
                const vp = page.getViewport({ scale: 1 });
                const scale = Math.min(maxW / vp.width, maxH / vp.height);
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const svp = page.getViewport({ scale: scale * dpr });

                canvas.width = svp.width;
                canvas.height = svp.height;
                canvas.style.width = `${svp.width / dpr}px`;
                canvas.style.height = `${svp.height / dpr}px`;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                await page.render({ canvasContext: ctx, viewport: svp }).promise;
                state.renderedPages.set(pageNum, cacheKey);

                if (isMobile) setupPinchZoom(zc, zw);
            } catch (err) {
                console.error('Render error', pageNum, err);
            }
        }

        // Pinch Zoom
        function setupPinchZoom(container, wrapper) {
            if (container._zoomSetup) return;
            container._zoomSetup = true;
            let lastTap = 0, isPanning = false;
            let panSX = 0, panSY = 0, panTX = 0, panTY = 0;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault(); e.stopPropagation();
                    state.zoom.isPinching = true;
                    state.zoom.startDistance = getDistance(e.touches[0], e.touches[1]);
                    state.zoom.startScale = state.zoom.scale;
                } else if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        e.preventDefault();
                        if (state.zoom.isZoomed) resetZoom();
                        else { state.zoom.scale = 2.5; applyZoom(); }
                        lastTap = 0; return;
                    }
                    lastTap = now;
                    if (state.zoom.isZoomed) {
                        isPanning = true;
                        panSX = e.touches[0].clientX; panSY = e.touches[0].clientY;
                        panTX = state.zoom.translateX; panTY = state.zoom.translateY;
                        wrapper.style.transition = 'none';
                    }
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && state.zoom.isPinching) {
                    e.preventDefault(); e.stopPropagation();
                    const dist = getDistance(e.touches[0], e.touches[1]);
                    state.zoom.scale = clamp(state.zoom.startScale * (dist / state.zoom.startDistance), 1, state.zoom.maxScale);
                    wrapper.style.transition = 'none';
                    applyZoom();
                } else if (e.touches.length === 1 && isPanning && state.zoom.isZoomed) {
                    e.preventDefault(); e.stopPropagation();
                    state.zoom.translateX = panTX + (e.touches[0].clientX - panSX);
                    state.zoom.translateY = panTY + (e.touches[0].clientY - panSY);
                    applyZoom();
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (state.zoom.isPinching && e.touches.length < 2) {
                    state.zoom.isPinching = false;
                    wrapper.style.transition = 'transform 0.3s ease';
                    if (state.zoom.scale < 1.08) resetZoom();
                    setTimeout(() => { wrapper.style.transition = ''; }, 300);
                }
                if (e.touches.length === 0) isPanning = false;
            });
        }

        // Zoom Controls
        el.zoomIn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.currentIndex > 0) {
                state.zoom.scale = clamp(state.zoom.scale + 0.5, 1, state.zoom.maxScale);
                applyZoom();
            }
        });
        el.zoomOut.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.currentIndex > 0) {
                state.zoom.scale = clamp(state.zoom.scale - 0.5, 1, state.zoom.maxScale);
                if (state.zoom.scale <= 1.05) resetZoom(); else applyZoom();
            }
        });
        el.zoomReset.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(); });

        // ─── TOUCH NAVIGATION (horizontal swipe) ───
        let touchSX = 0, touchSY = 0, touchST = 0, touchMoved = false;
        let currentDeltaX = 0;

        el.touchArea.addEventListener('touchstart', (e) => {
            if (state.zoom.isZoomed || state.zoom.isPinching) return;
            if (e.touches.length !== 1) return;
            touchSX = e.touches[0].clientX;
            touchSY = e.touches[0].clientY;
            touchST = Date.now();
            touchMoved = false;
            currentDeltaX = 0;
        }, { passive: true });

        el.touchArea.addEventListener('touchmove', (e) => {
            if (state.zoom.isZoomed || state.zoom.isPinching) return;
            if (e.touches.length !== 1) return;
            touchMoved = true;

            // Calculate delta for visual feedback
            const dx = e.touches[0].clientX - touchSX;
            const dy = e.touches[0].clientY - touchSY;

            // Only do horizontal
            if (Math.abs(dx) > Math.abs(dy)) {
                currentDeltaX = dx;
                // Apply subtle drag effect on current card
                const currentCard = el.pageStack.querySelector('.stack-card.current');
                if (currentCard) {
                    const dragPercent = clamp(dx / window.innerWidth * 100, -15, 15);
                    currentCard.style.transition = 'none';
                    currentCard.style.transform = `translateX(${dragPercent}%) scale(${1 - Math.abs(dragPercent) * 0.002})`;
                }
            }
        }, { passive: true });

        el.touchArea.addEventListener('touchend', (e) => {
            if (state.zoom.isZoomed || state.zoom.isPinching) return;

            // Reset drag effect
            const currentCard = el.pageStack.querySelector('.stack-card.current');
            if (currentCard) {
                currentCard.style.transition = '';
                currentCard.style.transform = '';
            }

            if (!touchMoved) return;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const diffX = touchSX - endX;
            const diffY = touchSY - endY;
            const elapsed = Date.now() - touchST;

            // Horizontal swipe detection
            if (Math.abs(diffX) > Math.abs(diffY) * 0.8) {
                const threshold = elapsed < 250 ? 25 : 50;
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) goToCard(state.currentIndex + 1); // swipe left = next
                    else goToCard(state.currentIndex - 1); // swipe right = prev
                }
            }
        }, { passive: true });

        // Mouse wheel (horizontal or vertical)
        let wheelTimer, wheelAcc = 0;
        document.addEventListener('wheel', (e) => {
            if (state.zoom.isZoomed) return;
            const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            wheelAcc += delta;
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => {
                if (wheelAcc > 40) goToCard(state.currentIndex + 1);
                else if (wheelAcc < -40) goToCard(state.currentIndex - 1);
                wheelAcc = 0;
            }, 60);
        }, { passive: true });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ':
                    if (!state.zoom.isZoomed) { e.preventDefault(); goToCard(state.currentIndex + 1); } break;
                case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
                    if (!state.zoom.isZoomed) { e.preventDefault(); goToCard(state.currentIndex - 1); } break;
                case 'Home': e.preventDefault(); goToCard(0); break;
                case 'End': e.preventDefault(); goToCard(state.totalCards - 1); break;
                case 'Escape': if (state.zoom.isZoomed) resetZoom(); break;
                case '+': case '=':
                    if (state.currentIndex > 0) { state.zoom.scale = clamp(state.zoom.scale + 0.25, 1, 5); applyZoom(); } break;
                case '-':
                    if (state.currentIndex > 0) { state.zoom.scale = clamp(state.zoom.scale - 0.25, 1, 5); if (state.zoom.scale <= 1.05) resetZoom(); else applyZoom(); } break;
                case '0': resetZoom(); break;
            }
        });

        // File Upload
        el.uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); el.uploadArea.classList.add('drag-over'); });
        el.uploadArea.addEventListener('dragleave', () => { el.uploadArea.classList.remove('drag-over'); });
        el.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault(); el.uploadArea.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f?.type === 'application/pdf') loadPDFFile(f);
        });
        el.fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadPDFFile(e.target.files[0]); });

        function loadPDFFile(file) {
            const r = new FileReader();
            r.onload = () => loadPDF({ data: new Uint8Array(r.result) });
            r.readAsArrayBuffer(file);
        }
        function showStatus(m, t) { el.status.className = `status ${t}`; el.status.textContent = m; }
        function hideStatus() { el.status.className = 'status'; el.status.textContent = ''; }

        // Load PDF
        async function loadPDF(source) {
            showStatus('Loading...', 'loading');
            try {
                state.pdfDoc = await pdfjsLib.getDocument(source).promise;
                const n = state.pdfDoc.numPages;
                el.uploadContainer.classList.add('hidden');

                for (let i = 1; i <= n; i++) {
                    const card = document.createElement('div');
                    card.className = 'stack-card pdf-card hidden-right';
                    card.dataset.index = i;
                    el.pageStack.appendChild(card);
                }

                state.totalCards = n + 1;
                el.navDots.classList.add('visible');
                el.pageCounter.classList.add('visible');
                el.progressBar.classList.add('visible');
                createNavDots();
                updateUI();

                await renderPage(1);
                renderPage(2); renderPage(3);
                hideStatus();

                if (isMobile) {
                    setTimeout(() => {
                        el.zoomHint.classList.add('visible');
                        setTimeout(() => el.zoomHint.classList.remove('visible'), 3500);
                    }, 1000);
                }
            } catch (err) {
                console.error('PDF error:', err);
                showStatus('Error loading PDF', 'error');
            }
        }

        // Resize
        let resizeTimer;
        function handleResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear();
                    resetZoom();
                    [state.currentIndex - 1, state.currentIndex, state.currentIndex + 1, state.currentIndex + 2]
                        .forEach(p => renderPage(p));
                }
            }, 200);
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            tryLockLandscape();
            setTimeout(handleResize, 400);
        });

        // Prevent browser gestures
        document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

        // Prevent pull-to-refresh & overscroll
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && !state.zoom.isZoomed) {
                // Allow only if inside pdf-zoom-container and zoomed
            }
        }, { passive: true });

        // Init
        window.addEventListener('load', () => {
            setTimeout(() => el.loader.classList.add('hidden'), 300);

            el.video.addEventListener('error', () => console.log('Video not found'));

            loadPDF('pdf1.pdf').catch(() => console.log('Auto-load failed'));
        });
    </script>
</body>
</html>
