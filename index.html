<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PDF Slideshow</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #1d1d1f 0%, #161617 50%, #0d0d0d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        /* Loader */
        .loader {
            position: fixed;
            inset: 0;
            background: #1d1d1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .slides-wrapper {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Page Stack Container */
        .page-stack {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Individual Card (Video or PDF Page) */
        .stack-card {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity, filter;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Card inner content wrapper */
        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        /* Video Card Specific */
        .stack-card.video-card .card-content {
            width: calc(100vw - 40px);
            height: calc(100vh - 120px);
            height: calc(100dvh - 120px);
            max-width: 1200px;
            max-height: 800px;
        }

        .stack-card.video-card video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Changed from cover to contain */
            border-radius: 12px;
            background: #000;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.2), 
                transparent 30%,
                transparent 70%,
                rgba(0,0,0,0.4));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 40px 20px;
            border-radius: 12px;
            pointer-events: none;
        }

        .video-title {
            color: #fff;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 8px;
        }

        .video-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 400;
            text-align: center;
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .scroll-hint::after {
            content: '';
            width: 16px;
            height: 16px;
            border-right: 1.5px solid rgba(255,255,255,0.4);
            border-bottom: 1.5px solid rgba(255,255,255,0.4);
            transform: rotate(45deg);
            animation: scrollBounce 2s ease-in-out infinite;
        }

        @keyframes scrollBounce {
            0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.4; }
            50% { transform: rotate(45deg) translateY(4px); opacity: 1; }
        }

        /* Fullscreen Button - Mobile Only */
        .fullscreen-btn {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
            transition: all 0.2s ease;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.8);
            transform: scale(1.05);
        }

        .fullscreen-btn:active {
            transform: scale(0.95);
        }

        /* Show fullscreen button only on mobile/touch devices */
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .fullscreen-btn {
                display: flex;
            }
        }

        /* PDF Card Specific */
        .stack-card.pdf-card {
            overflow: visible;
        }

        .pdf-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
        }

        .pdf-zoom-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        .stack-card.pdf-card canvas {
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 140px);
            max-height: calc(100dvh - 140px);
            width: auto;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            background: #fff;
        }

        /* Zoom Controls - Mobile Only */
        .zoom-controls {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 8px;
            gap: 4px;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .zoom-controls.visible {
            display: flex;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .zoom-btn:active {
            transform: scale(0.9);
        }

        .zoom-level {
            min-width: 50px;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-reset {
            font-size: 12px;
            padding: 0 12px;
        }

        /* Show zoom controls on mobile when PDF is active */
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .zoom-controls.visible {
                display: flex;
            }
        }

        /* Stack Position Classes */
        .stack-card.prev-4 {
            transform: translateY(-28px) scale(0.82);
            opacity: 0;
            filter: grayscale(100%) brightness(0.3);
            z-index: 0;
            pointer-events: none;
        }

        .stack-card.prev-3 {
            transform: translateY(-21px) scale(0.86);
            opacity: 0.12;
            filter: grayscale(100%) brightness(0.35);
            z-index: 1;
        }

        .stack-card.prev-2 {
            transform: translateY(-14px) scale(0.90);
            opacity: 0.2;
            filter: grayscale(100%) brightness(0.45);
            z-index: 2;
        }

        .stack-card.prev-1 {
            transform: translateY(-7px) scale(0.95);
            opacity: 0.35;
            filter: grayscale(100%) brightness(0.55);
            z-index: 3;
        }

        .stack-card.current {
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: none;
            z-index: 10;
        }

        .stack-card.next-1 {
            transform: translateY(7px) scale(0.95);
            opacity: 0.35;
            filter: grayscale(100%) brightness(0.55);
            z-index: 3;
        }

        .stack-card.next-2 {
            transform: translateY(14px) scale(0.90);
            opacity: 0.2;
            filter: grayscale(100%) brightness(0.45);
            z-index: 2;
        }

        .stack-card.next-3 {
            transform: translateY(21px) scale(0.86);
            opacity: 0.12;
            filter: grayscale(100%) brightness(0.35);
            z-index: 1;
        }

        .stack-card.next-4 {
            transform: translateY(28px) scale(0.82);
            opacity: 0;
            filter: grayscale(100%) brightness(0.3);
            z-index: 0;
            pointer-events: none;
        }

        .stack-card.hidden-above {
            transform: translateY(-80px) scale(0.7);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .stack-card.hidden-below {
            transform: translateY(80px) scale(0.7);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Upload Container */
        .upload-container {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            background: linear-gradient(180deg, #1d1d1f 0%, #161617 50%, #0d0d0d 100%);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .upload-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .upload-content {
            max-width: 380px;
            width: 100%;
            text-align: center;
            color: #fff;
        }

        .upload-content h2 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #f5f5f7;
        }

        .upload-content > p {
            color: #86868b;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .upload-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 48px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-area p {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin-top: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
        }

        .status.loading {
            background: rgba(255,255,255,0.05);
            color: #f5f5f7;
        }

        .status.error {
            background: rgba(255,59,48,0.15);
            color: #ff453a;
        }

        /* Page Counter */
        .page-counter {
            position: fixed;
            bottom: max(24px, env(safe-area-inset-bottom, 24px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28,28,30,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 22px;
            border-radius: 980px;
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .page-counter.visible {
            opacity: 1;
        }

        .page-counter .label {
            color: #86868b;
            margin-right: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .page-counter .current {
            color: #fff;
            font-weight: 600;
        }

        .page-counter .separator {
            color: #48484a;
        }

        .page-counter .total {
            color: #86868b;
        }

        /* Navigation Dots */
        .nav-dots {
            position: fixed;
            right: max(16px, env(safe-area-inset-right, 16px));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-dots.visible {
            opacity: 1;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-dot::before {
            content: attr(data-label);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #f5f5f7;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .nav-dot:hover::before {
            opacity: 1;
        }

        .nav-dot:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.3);
        }

        .nav-dot.active {
            background: #fff;
        }

        .nav-dot.video-dot {
            background: rgba(255,59,48,0.4);
        }

        .nav-dot.video-dot.active {
            background: #ff453a;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #0071e3, #5ac8fa);
            z-index: 1000;
            transition: width 0.4s ease;
            opacity: 0;
        }

        .progress-bar.visible {
            opacity: 1;
        }

        /* Touch Area */
        .touch-area {
            position: fixed;
            inset: 0;
            z-index: 50;
            touch-action: pan-y;
        }

        /* Disable touch area when zoomed */
        .touch-area.zoom-active {
            pointer-events: none;
        }

        /* Pinch to zoom hint */
        .zoom-hint {
            display: none;
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28,28,30,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInOut 3s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .zoom-hint.visible {
                display: block;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stack-card.video-card .card-content {
                width: calc(100vw - 24px);
                height: calc(100vh - 100px);
                height: calc(100dvh - 100px);
            }

            .stack-card.pdf-card canvas {
                max-width: calc(100vw - 24px);
                max-height: calc(100vh - 160px);
                max-height: calc(100dvh - 160px);
            }

            .nav-dots {
                right: 10px;
                gap: 6px;
            }

            .nav-dot {
                width: 6px;
                height: 6px;
            }

            .nav-dot::before {
                display: none;
            }

            .page-counter {
                padding: 8px 16px;
                font-size: 13px;
            }

            .page-counter .label {
                display: none;
            }

            .video-overlay {
                padding: 30px 16px;
            }

            .scroll-hint {
                bottom: 20px;
            }
        }

        @media (orientation: portrait) {
            .stack-card.video-card .card-content {
                width: calc(100vw - 20px);
                height: auto;
                aspect-ratio: 16/9;
                max-height: calc(100vh - 180px);
                max-height: calc(100dvh - 180px);
            }

            .stack-card.pdf-card canvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 180px);
                max-height: calc(100dvh - 180px);
            }

            /* Adjust stack spacing for portrait */
            .stack-card.prev-1 { transform: translateY(-10px) scale(0.94); }
            .stack-card.prev-2 { transform: translateY(-20px) scale(0.88); }
            .stack-card.prev-3 { transform: translateY(-30px) scale(0.82); }
            .stack-card.next-1 { transform: translateY(10px) scale(0.94); }
            .stack-card.next-2 { transform: translateY(20px) scale(0.88); }
            .stack-card.next-3 { transform: translateY(30px) scale(0.82); }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .stack-card.video-card .card-content {
                height: calc(100vh - 40px);
                height: calc(100dvh - 40px);
                width: auto;
                aspect-ratio: 16/9;
            }

            .stack-card.pdf-card canvas {
                max-height: calc(100vh - 60px);
                max-height: calc(100dvh - 60px);
            }

            .page-counter {
                bottom: 10px;
                padding: 6px 14px;
                font-size: 12px;
            }

            .nav-dots {
                gap: 4px;
            }

            .nav-dot {
                width: 5px;
                height: 5px;
            }

            .video-overlay {
                padding: 20px 16px;
            }

            .scroll-hint {
                bottom: 15px;
                font-size: 10px;
            }

            .fullscreen-btn {
                top: 10px;
                right: 10px;
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .zoom-controls {
                bottom: 50px;
            }
        }

        /* Fullscreen styles */
        :fullscreen {
            background: #000;
        }

        :fullscreen .stack-card.video-card .card-content {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border-radius: 0;
        }

        :fullscreen .stack-card.video-card video {
            border-radius: 0;
        }

        :fullscreen .video-overlay {
            border-radius: 0;
        }

        :fullscreen .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        :fullscreen .scroll-hint {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Navigation Dots -->
    <div class="nav-dots" id="navDots"></div>

    <!-- Page Counter -->
    <div class="page-counter" id="pageCounter">
        <span class="label">Page</span>
        <span class="current">1</span>
        <span class="separator">/</span>
        <span class="total">1</span>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls" id="zoomControls">
        <button class="zoom-btn" id="zoomOut">−</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button class="zoom-btn" id="zoomIn">+</button>
        <button class="zoom-btn zoom-reset" id="zoomReset">Reset</button>
    </div>

    <!-- Zoom Hint -->
    <div class="zoom-hint" id="zoomHint">👆 Pinch to zoom • Double-tap to reset</div>

    <!-- Upload Container -->
    <div class="upload-container" id="uploadContainer">
        <div class="upload-content">
            <h2>Upload PDF</h2>
            <p>Transform your document into a beautiful presentation</p>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <p>Drag and drop your PDF here</p>
                <input type="file" id="fileInput" accept=".pdf">
                <label for="fileInput" class="upload-btn">Choose File</label>
            </div>
            
            <div id="status"></div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="slides-wrapper" id="slidesWrapper">
        <!-- Page Stack -->
        <div class="page-stack" id="pageStack">
            <!-- Video Card (index 0) -->
            <div class="stack-card video-card current" data-index="0">
                <div class="card-content">
                    <video id="mainVideo" autoplay muted loop playsinline>
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <h1 class="video-title"></h1>
                        <p class="video-subtitle"></p>
                        <div class="scroll-hint">Scroll</div>
                    </div>
                    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Touch Area -->
    <div class="touch-area" id="touchArea"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            currentIndex: 0,
            totalCards: 1,
            isAnimating: false,
            pdfDoc: null,
            renderedPages: new Map(),
            zoom: {
                scale: 1,
                minScale: 1,
                maxScale: 4,
                translateX: 0,
                translateY: 0,
                isZoomed: false
            }
        };

        const elements = {
            loader: document.getElementById('loader'),
            progressBar: document.getElementById('progressBar'),
            navDots: document.getElementById('navDots'),
            pageCounter: document.getElementById('pageCounter'),
            uploadContainer: document.getElementById('uploadContainer'),
            pageStack: document.getElementById('pageStack'),
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            status: document.getElementById('status'),
            touchArea: document.getElementById('touchArea'),
            mainVideo: document.getElementById('mainVideo'),
            fullscreenBtn: document.getElementById('fullscreenBtn'),
            zoomControls: document.getElementById('zoomControls'),
            zoomLevel: document.getElementById('zoomLevel'),
            zoomIn: document.getElementById('zoomIn'),
            zoomOut: document.getElementById('zoomOut'),
            zoomReset: document.getElementById('zoomReset'),
            zoomHint: document.getElementById('zoomHint')
        };

        // Detect mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                         (('ontouchstart' in window) && window.innerWidth < 1024);

        // Get container dimensions for PDF rendering
        function getContainerDimensions() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isShortLandscape = !isPortrait && window.innerHeight < 500;
            
            let maxWidth, maxHeight;
            
            if (isPortrait) {
                maxWidth = window.innerWidth - 20;
                maxHeight = window.innerHeight - 180;
            } else if (isShortLandscape) {
                maxWidth = window.innerWidth - 40;
                maxHeight = window.innerHeight - 60;
            } else {
                maxWidth = window.innerWidth - 40;
                maxHeight = window.innerHeight - 140;
            }
            
            return { width: maxWidth, height: maxHeight, isPortrait };
        }

        // Create navigation dots
        function createNavDots() {
            elements.navDots.innerHTML = '';
            
            for (let i = 0; i < state.totalCards; i++) {
                const dot = document.createElement('div');
                const isVideo = i === 0;
                dot.className = `nav-dot ${isVideo ? 'video-dot' : ''} ${i === state.currentIndex ? 'active' : ''}`;
                dot.dataset.label = isVideo ? 'Video' : `Page ${i}`;
                dot.onclick = () => goToCard(i);
                elements.navDots.appendChild(dot);
            }
        }

        // Update UI
        function updateUI() {
            // Update nav dots
            const dots = elements.navDots.querySelectorAll('.nav-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === state.currentIndex);
            });

            // Update progress bar
            const progress = state.totalCards > 1 ? 
                (state.currentIndex / (state.totalCards - 1)) * 100 : 0;
            elements.progressBar.style.width = `${progress}%`;

            // Update page counter
            if (state.currentIndex > 0) {
                elements.pageCounter.querySelector('.current').textContent = state.currentIndex;
                elements.pageCounter.querySelector('.total').textContent = state.totalCards - 1;
            } else {
                elements.pageCounter.querySelector('.current').textContent = '▶';
                elements.pageCounter.querySelector('.total').textContent = state.totalCards - 1;
            }

            // Update zoom controls visibility
            if (state.currentIndex > 0 && isMobile) {
                elements.zoomControls.classList.add('visible');
            } else {
                elements.zoomControls.classList.remove('visible');
            }

            // Update card stack positions
            updateCardStack();
        }

        // Update card stack visual positions
        function updateCardStack() {
            const cards = elements.pageStack.querySelectorAll('.stack-card');
            
            cards.forEach((card) => {
                const cardIndex = parseInt(card.dataset.index);
                const diff = cardIndex - state.currentIndex;
                
                // Remove all position classes
                card.classList.remove(
                    'prev-4', 'prev-3', 'prev-2', 'prev-1', 
                    'current', 
                    'next-1', 'next-2', 'next-3', 'next-4',
                    'hidden-above', 'hidden-below'
                );
                
                // Add appropriate class based on position
                if (diff === 0) {
                    card.classList.add('current');
                } else if (diff === -1) {
                    card.classList.add('prev-1');
                } else if (diff === -2) {
                    card.classList.add('prev-2');
                } else if (diff === -3) {
                    card.classList.add('prev-3');
                } else if (diff === -4) {
                    card.classList.add('prev-4');
                } else if (diff < -4) {
                    card.classList.add('hidden-above');
                } else if (diff === 1) {
                    card.classList.add('next-1');
                } else if (diff === 2) {
                    card.classList.add('next-2');
                } else if (diff === 3) {
                    card.classList.add('next-3');
                } else if (diff === 4) {
                    card.classList.add('next-4');
                } else {
                    card.classList.add('hidden-below');
                }
            });

            // Control video playback
            if (state.currentIndex === 0) {
                elements.mainVideo?.play();
            } else {
                elements.mainVideo?.pause();
            }
        }

        // Reset zoom when changing pages
        function resetZoom() {
            state.zoom.scale = 1;
            state.zoom.translateX = 0;
            state.zoom.translateY = 0;
            state.zoom.isZoomed = false;
            
            elements.zoomLevel.textContent = '100%';
            elements.touchArea.classList.remove('zoom-active');
            
            // Reset all zoom wrappers
            document.querySelectorAll('.pdf-zoom-wrapper').forEach(wrapper => {
                wrapper.style.transform = 'scale(1) translate(0px, 0px)';
            });
        }

        // Navigate to card
        function goToCard(index) {
            if (state.isAnimating) return;
            if (index < 0 || index >= state.totalCards) return;
            if (index === state.currentIndex) return;

            // Reset zoom when changing pages
            resetZoom();

            state.isAnimating = true;
            state.currentIndex = index;
            
            updateUI();

            // Render adjacent PDF pages
            if (state.pdfDoc && index > 0) {
                renderPage(index);
                renderPage(index + 1);
                renderPage(index + 2);
                renderPage(index - 1);
            } else if (state.pdfDoc && index === 0) {
                renderPage(1);
                renderPage(2);
            }

            setTimeout(() => {
                state.isAnimating = false;
            }, 600);
        }

        // Render PDF page
        async function renderPage(pageNum) {
            if (!state.pdfDoc) return;
            if (pageNum < 1 || pageNum > state.pdfDoc.numPages) return;

            const container = getContainerDimensions();
            const cacheKey = `${pageNum}-${container.width}-${container.height}`;
            
            if (state.renderedPages.get(pageNum) === cacheKey) return;

            try {
                const page = await state.pdfDoc.getPage(pageNum);
                const cardIndex = pageNum;
                const card = elements.pageStack.querySelector(`.stack-card[data-index="${cardIndex}"]`);
                
                if (!card) return;

                let zoomContainer = card.querySelector('.pdf-zoom-container');
                if (!zoomContainer) {
                    zoomContainer = document.createElement('div');
                    zoomContainer.className = 'pdf-zoom-container';
                    
                    const zoomWrapper = document.createElement('div');
                    zoomWrapper.className = 'pdf-zoom-wrapper';
                    
                    zoomContainer.appendChild(zoomWrapper);
                    card.appendChild(zoomContainer);
                }

                const zoomWrapper = card.querySelector('.pdf-zoom-wrapper');
                let canvas = zoomWrapper.querySelector('canvas');
                if (!canvas) {
                    canvas = document.createElement('canvas');
                    zoomWrapper.appendChild(canvas);
                }

                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1 });
                
                // Calculate scale to fit container
                const scaleX = container.width / viewport.width;
                const scaleY = container.height / viewport.height;
                const scale = Math.min(scaleX, scaleY);
                
                // Device pixel ratio for sharpness
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const renderScale = scale * dpr;
                
                const scaledViewport = page.getViewport({ scale: renderScale });
                
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                canvas.style.width = `${scaledViewport.width / dpr}px`;
                canvas.style.height = `${scaledViewport.height / dpr}px`;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                await page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise;

                state.renderedPages.set(pageNum, cacheKey);

                // Setup pinch zoom for this page
                if (isMobile) {
                    setupPinchZoom(zoomContainer, zoomWrapper);
                }

            } catch (error) {
                console.error('Error rendering page:', pageNum, error);
            }
        }

        // Setup pinch zoom for PDF
        function setupPinchZoom(container, wrapper) {
            let initialDistance = 0;
            let initialScale = 1;
            let lastTapTime = 0;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                    initialScale = state.zoom.scale;
                } else if (e.touches.length === 1) {
                    // Double tap detection
                    const now = Date.now();
                    if (now - lastTapTime < 300) {
                        e.preventDefault();
                        if (state.zoom.scale > 1) {
                            resetZoom();
                        } else {
                            // Zoom to 2x on double tap
                            state.zoom.scale = 2;
                            state.zoom.isZoomed = true;
                            elements.touchArea.classList.add('zoom-active');
                            wrapper.style.transform = `scale(${state.zoom.scale})`;
                            elements.zoomLevel.textContent = `${Math.round(state.zoom.scale * 100)}%`;
                        }
                    }
                    lastTapTime = now;
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const currentDistance = getDistance(e.touches[0], e.touches[1]);
                    const scale = initialScale * (currentDistance / initialDistance);
                    
                    state.zoom.scale = Math.max(state.zoom.minScale, Math.min(state.zoom.maxScale, scale));
                    state.zoom.isZoomed = state.zoom.scale > 1;
                    
                    if (state.zoom.isZoomed) {
                        elements.touchArea.classList.add('zoom-active');
                    } else {
                        elements.touchArea.classList.remove('zoom-active');
                    }
                    
                    wrapper.style.transform = `scale(${state.zoom.scale})`;
                    elements.zoomLevel.textContent = `${Math.round(state.zoom.scale * 100)}%`;
                }
            }, { passive: false });

            container.addEventListener('touchend', () => {
                if (state.zoom.scale <= 1.05) {
                    resetZoom();
                }
            });
        }

        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Zoom controls
        elements.zoomIn.addEventListener('click', () => {
            if (state.currentIndex > 0) {
                state.zoom.scale = Math.min(state.zoom.maxScale, state.zoom.scale + 0.5);
                state.zoom.isZoomed = state.zoom.scale > 1;
                applyZoom();
            }
        });

        elements.zoomOut.addEventListener('click', () => {
            if (state.currentIndex > 0) {
                state.zoom.scale = Math.max(state.zoom.minScale, state.zoom.scale - 0.5);
                state.zoom.isZoomed = state.zoom.scale > 1;
                applyZoom();
            }
        });

        elements.zoomReset.addEventListener('click', resetZoom);

        function applyZoom() {
            const wrapper = document.querySelector(`.stack-card[data-index="${state.currentIndex}"] .pdf-zoom-wrapper`);
            if (wrapper) {
                wrapper.style.transform = `scale(${state.zoom.scale})`;
                elements.zoomLevel.textContent = `${Math.round(state.zoom.scale * 100)}%`;
                
                if (state.zoom.isZoomed) {
                    elements.touchArea.classList.add('zoom-active');
                } else {
                    elements.touchArea.classList.remove('zoom-active');
                }
            }
        }

        // Fullscreen functionality
        elements.fullscreenBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            const videoCard = document.querySelector('.stack-card.video-card');
            
            if (!document.fullscreenElement) {
                try {
                    // Try to lock to landscape
                    if (screen.orientation && screen.orientation.lock) {
                        try {
                            await screen.orientation.lock('landscape');
                        } catch (err) {
                            console.log('Orientation lock not supported');
                        }
                    }
                    
                    // Enter fullscreen
                    if (videoCard.requestFullscreen) {
                        await videoCard.requestFullscreen();
                    } else if (videoCard.webkitRequestFullscreen) {
                        await videoCard.webkitRequestFullscreen();
                    } else if (elements.mainVideo.webkitEnterFullscreen) {
                        // iOS Safari fallback
                        elements.mainVideo.webkitEnterFullscreen();
                    }
                    
                    elements.fullscreenBtn.textContent = '✕';
                } catch (err) {
                    console.error('Fullscreen error:', err);
                }
            } else {
                if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    await document.webkitExitFullscreen();
                }
                
                // Unlock orientation
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                
                elements.fullscreenBtn.textContent = '⛶';
            }
        });

        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                elements.fullscreenBtn.textContent = '⛶';
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        // Load PDF
        async function loadPDF(source) {
            showStatus('Loading PDF...', 'loading');

            try {
                state.pdfDoc = await pdfjsLib.getDocument(source).promise;
                const numPages = state.pdfDoc.numPages;

                // Hide upload container
                elements.uploadContainer.classList.add('hidden');

                // Create PDF page cards (starting at index 1)
                for (let i = 1; i <= numPages; i++) {
                    const card = document.createElement('div');
                    card.className = 'stack-card pdf-card hidden-below';
                    card.dataset.index = i;
                    elements.pageStack.appendChild(card);
                }

                // Update total cards (video + PDF pages)
                state.totalCards = numPages + 1;

                // Show UI elements
                elements.navDots.classList.add('visible');
                elements.pageCounter.classList.add('visible');
                elements.progressBar.classList.add('visible');

                createNavDots();
                updateUI();

                // Render first few pages
                await renderPage(1);
                renderPage(2);
                renderPage(3);

                hideStatus();

                // Show zoom hint on mobile
                if (isMobile) {
                    setTimeout(() => {
                        elements.zoomHint.classList.add('visible');
                        setTimeout(() => {
                            elements.zoomHint.classList.remove('visible');
                        }, 3500);
                    }, 1000);
                }

            } catch (error) {
                console.error('PDF load error:', error);
                showStatus('Error loading PDF', 'error');
            }
        }

        // Status messages
        function showStatus(msg, type) {
            elements.status.className = `status ${type}`;
            elements.status.textContent = msg;
            elements.status.style.display = 'block';
        }

        function hideStatus() {
            elements.status.style.display = 'none';
        }

        // Touch handling for navigation
        let touchStartY = 0;
        let touchStartTime = 0;

        elements.touchArea.addEventListener('touchstart', (e) => {
            if (state.zoom.isZoomed) return;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        elements.touchArea.addEventListener('touchend', (e) => {
            if (state.zoom.isZoomed) return;
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            const time = Date.now() - touchStartTime;

            if (Math.abs(diff) > 50 || (Math.abs(diff) > 30 && time < 300)) {
                if (diff > 0) {
                    goToCard(state.currentIndex + 1);
                } else {
                    goToCard(state.currentIndex - 1);
                }
            }
        }, { passive: true });

        // Mouse wheel
        let wheelTimer;
        let wheelAccumulator = 0;
        
        document.addEventListener('wheel', (e) => {
            if (state.zoom.isZoomed) return;
            
            wheelAccumulator += e.deltaY;
            
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => {
                if (wheelAccumulator > 50) {
                    goToCard(state.currentIndex + 1);
                } else if (wheelAccumulator < -50) {
                    goToCard(state.currentIndex - 1);
                }
                wheelAccumulator = 0;
            }, 80);
        }, { passive: true });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowDown':
                case 'ArrowRight':
                case 'PageDown':
                case ' ':
                    if (!state.zoom.isZoomed) {
                        e.preventDefault();
                        goToCard(state.currentIndex + 1);
                    }
                    break;
                case 'ArrowUp':
                case 'ArrowLeft':
                case 'PageUp':
                    if (!state.zoom.isZoomed) {
                        e.preventDefault();
                        goToCard(state.currentIndex - 1);
                    }
                    break;
                case 'Home':
                    e.preventDefault();
                    goToCard(0);
                    break;
                case 'End':
                    e.preventDefault();
                    goToCard(state.totalCards - 1);
                    break;
                case 'Escape':
                    if (state.zoom.isZoomed) {
                        resetZoom();
                    }
                    break;
                case 'f':
                case 'F':
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen?.();
                    } else {
                        document.exitFullscreen?.();
                    }
                    break;
                case '+':
                case '=':
                    if (state.currentIndex > 0) {
                        state.zoom.scale = Math.min(state.zoom.maxScale, state.zoom.scale + 0.25);
                        applyZoom();
                    }
                    break;
                case '-':
                    if (state.currentIndex > 0) {
                        state.zoom.scale = Math.max(state.zoom.minScale, state.zoom.scale - 0.25);
                        applyZoom();
                    }
                    break;
                case '0':
                    resetZoom();
                    break;
            }
        });

        // File upload
        elements.uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.add('drag-over');
        });

        elements.uploadArea.addEventListener('dragleave', () => {
            elements.uploadArea.classList.remove('drag-over');
        });

        elements.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file?.type === 'application/pdf') {
                loadPDFFromFile(file);
            }
        });

        elements.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPDFFromFile(file);
        });

        function loadPDFFromFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                loadPDF({ data: new Uint8Array(reader.result) });
            };
            reader.readAsArrayBuffer(file);
        }

        // Handle resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear();
                    resetZoom();
                    renderPage(state.currentIndex);
                    renderPage(state.currentIndex + 1);
                    renderPage(state.currentIndex - 1);
                }
            }, 150);
        });

        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear();
                    resetZoom();
                    renderPage(state.currentIndex);
                    renderPage(state.currentIndex + 1);
                    renderPage(state.currentIndex - 1);
                }
            }, 300);
        });

        // Initialize
        window.addEventListener('load', () => {
            setTimeout(() => {
                elements.loader.classList.add('hidden');
            }, 500);

            // Video error handling
            elements.mainVideo.addEventListener('error', () => {
                console.log('Video could not be loaded');
            });

            // Try auto-load PDF
            loadPDF('pdf1.pdf').catch(() => {
                console.log('Auto-load failed, showing upload UI');
            });
        });
    </script>
</body>
</html>
