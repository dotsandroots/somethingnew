<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PDF Slideshow</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        .loader {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader.hidden { opacity: 0; pointer-events: none; }

        .loader-ring {
            width: 40px; height: 40px;
            border: 2.5px solid rgba(255,255,255,0.08);
            border-top-color: rgba(255,255,255,0.7);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .loader-text {
            color: rgba(255,255,255,0.4);
            font-size: 13px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .slides-wrapper {
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden; position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .page-stack {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        .stack-card {
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.55s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform, opacity;
            border-radius: 16px; overflow: hidden;
        }

        .card-content {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            border-radius: 16px; overflow: hidden;
            background: #000; position: relative;
        }

        .stack-card.video-card .card-content {
            width: calc(100vw - 48px);
            height: calc(100dvh - 140px);
            max-width: 1100px; max-height: 720px;
            border-radius: 20px;
            box-shadow: 0 8px 60px rgba(0,0,0,0.6);
        }

        .stack-card.video-card video {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 20px;
            background: #000; display: block;
        }

        .video-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.15) 0%, transparent 25%,
                transparent 65%, rgba(0,0,0,0.5) 100%);
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding: 0 24px 50px; border-radius: 20px;
            pointer-events: none;
            opacity: 1; transition: opacity 0.3s ease;
        }
        .video-overlay.hidden-overlay { opacity: 0; }

        .video-title {
            color: #fff;
            font-size: clamp(1.4rem, 4.5vw, 2.2rem);
            font-weight: 700; letter-spacing: -0.03em;
            text-align: center; margin-bottom: 6px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .video-subtitle {
            color: rgba(255,255,255,0.55);
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            font-weight: 400; text-align: center;
        }

        .scroll-hint {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.45);
            font-size: 10px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            pointer-events: none;
        }
        .scroll-hint-arrow {
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            animation: scrollPulse 2s ease-in-out infinite;
        }
        .scroll-hint-arrow svg {
            width: 16px; height: 16px;
            stroke: rgba(255,255,255,0.4); stroke-width: 2; fill: none;
        }
        @keyframes scrollPulse {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(5px); opacity: 1; }
        }

        .video-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            border-radius: 0 0 20px 20px;
            pointer-events: auto;
            opacity: 1; transition: opacity 0.3s ease; z-index: 15;
        }
        .video-controls.hidden-controls { opacity: 0; pointer-events: none; }

        .video-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: none; border-radius: 50%;
            color: #fff; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; flex-shrink: 0;
        }
        .video-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
        .video-btn svg { width: 18px; height: 18px; fill: #fff; }

        .video-progress-bar {
            flex: 1; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .video-progress-fill {
            height: 100%; background: #fff;
            border-radius: 2px; width: 0%;
            transition: width 0.1s linear;
        }
        .video-time {
            color: rgba(255,255,255,0.7);
            font-size: 12px; font-weight: 500;
            font-variant-numeric: tabular-nums;
            min-width: 40px; text-align: right; flex-shrink: 0;
        }

        /* Top corner buttons - high z-index, pointer-events auto */
        .top-btn {
            position: absolute;
            width: 38px; height: 38px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #fff;
            cursor: pointer; z-index: 30;
            pointer-events: auto;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .top-btn:active { transform: scale(0.88); background: rgba(0,0,0,0.7); }
        .top-btn svg {
            width: 18px; height: 18px;
            stroke: #fff; stroke-width: 2; fill: none;
            pointer-events: none;
        }

        .fullscreen-btn { top: 14px; right: 14px; }
        .mute-btn { top: 14px; left: 14px; }
        .mute-btn svg { fill: #fff; stroke: none; }

        /* PDF Card */
        .stack-card.pdf-card { overflow: visible; }

        .pdf-zoom-container {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none;
        }
        .pdf-zoom-wrapper {
            display: flex; justify-content: center; align-items: center;
            transform-origin: center center; will-change: transform;
        }
        .stack-card.pdf-card canvas {
            max-width: calc(100vw - 40px);
            max-height: calc(100dvh - 160px);
            width: auto; height: auto;
            border-radius: 10px;
            box-shadow: 0 6px 40px rgba(0,0,0,0.4);
            background: #fff;
        }

        .zoom-controls {
            display: none;
            position: fixed;
            bottom: max(80px, calc(env(safe-area-inset-bottom, 20px) + 60px));
            left: 50%; transform: translateX(-50%);
            background: rgba(20,20,22,0.92);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 14px; padding: 6px; gap: 4px;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .zoom-controls.visible { display: flex; }

        .zoom-btn {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.08);
            border: none; border-radius: 10px;
            color: #fff; font-size: 18px; cursor: pointer;
            transition: all 0.15s ease;
            display: flex; align-items: center; justify-content: center;
            font-weight: 300;
        }
        .zoom-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.16); }

        .zoom-level {
            min-width: 48px; text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 12px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            letter-spacing: 0.5px;
        }
        .zoom-reset {
            font-size: 11px; padding: 0 12px;
            letter-spacing: 0.5px; font-weight: 600;
        }

        /* Stack positions */
        .stack-card.prev-4, .stack-card.hidden-above {
            transform: translateY(-60px) scale(0.78);
            opacity: 0; pointer-events: none; z-index: 0;
        }
        .stack-card.prev-3 {
            transform: translateY(-18px) scale(0.88);
            opacity: 0.08; filter: brightness(0.3);
            z-index: 1; pointer-events: none;
        }
        .stack-card.prev-2 {
            transform: translateY(-12px) scale(0.92);
            opacity: 0.15; filter: brightness(0.4);
            z-index: 2; pointer-events: none;
        }
        .stack-card.prev-1 {
            transform: translateY(-6px) scale(0.96);
            opacity: 0.3; filter: brightness(0.5);
            z-index: 3; pointer-events: none;
        }
        .stack-card.current {
            transform: translateY(0) scale(1);
            opacity: 1; filter: none; z-index: 10;
        }
        .stack-card.next-1 {
            transform: translateY(6px) scale(0.96);
            opacity: 0.3; filter: brightness(0.5);
            z-index: 3; pointer-events: none;
        }
        .stack-card.next-2 {
            transform: translateY(12px) scale(0.92);
            opacity: 0.15; filter: brightness(0.4);
            z-index: 2; pointer-events: none;
        }
        .stack-card.next-3 {
            transform: translateY(18px) scale(0.88);
            opacity: 0.08; filter: brightness(0.3);
            z-index: 1; pointer-events: none;
        }
        .stack-card.next-4, .stack-card.hidden-below {
            transform: translateY(60px) scale(0.78);
            opacity: 0; pointer-events: none; z-index: 0;
        }

        /* Upload */
        .upload-container {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; padding: 20px;
            background: #0a0a0a;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .upload-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .upload-content {
            max-width: 380px; width: 100%;
            text-align: center; color: #fff;
        }
        .upload-content h2 {
            font-size: 28px; font-weight: 700;
            letter-spacing: -0.03em; margin-bottom: 8px;
            color: #f5f5f7;
        }
        .upload-content > p {
            color: #6e6e73; font-size: 15px;
            margin-bottom: 36px; line-height: 1.5;
        }
        .upload-area {
            background: rgba(255,255,255,0.03);
            border: 1.5px dashed rgba(255,255,255,0.12);
            border-radius: 20px; padding: 52px 24px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.drag-over {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.25);
            border-style: solid;
        }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-area p { color: #6e6e73; font-size: 14px; margin-bottom: 24px; }
        .upload-btn {
            display: inline-block; padding: 13px 36px;
            background: #0a84ff; color: #fff; border: none;
            border-radius: 980px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .upload-btn:hover { background: #409cff; transform: scale(1.02); }
        .upload-btn:active { transform: scale(0.97); }
        input[type="file"] { display: none; }
        .status {
            margin-top: 24px; padding: 12px 20px;
            border-radius: 14px; font-size: 14px; display: none;
        }
        .status.loading {
            background: rgba(255,255,255,0.05);
            color: #f5f5f7; display: block;
        }
        .status.error {
            background: rgba(255,59,48,0.12);
            color: #ff453a; display: block;
        }

        /* Page counter */
        .page-counter {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: 50%; transform: translateX(-50%);
            background: rgba(20,20,22,0.88);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            padding: 9px 20px; border-radius: 980px;
            color: #f5f5f7; font-size: 13px; font-weight: 500;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.06);
            opacity: 0; transition: opacity 0.3s ease;
            display: flex; align-items: center; gap: 3px;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            user-select: none;
        }
        .page-counter.visible { opacity: 1; }
        .page-counter .label {
            color: #6e6e73; margin-right: 6px;
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; font-weight: 600;
        }
        .page-counter .current { color: #fff; font-weight: 700; }
        .page-counter .separator { color: #3a3a3c; margin: 0 1px; }
        .page-counter .total { color: #6e6e73; }

        /* Nav dots */
        .nav-dots {
            position: fixed;
            right: max(14px, env(safe-area-inset-right, 14px));
            top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 6px;
            z-index: 100; opacity: 0; transition: opacity 0.3s ease;
            padding: 8px 4px;
        }
        .nav-dots.visible { opacity: 1; }
        .nav-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.15); cursor: pointer;
            transition: all 0.3s ease; position: relative;
        }
        .nav-dot::before {
            content: attr(data-label);
            position: absolute; right: 20px; top: 50%;
            transform: translateY(-50%);
            background: rgba(20,20,22,0.92);
            backdrop-filter: blur(12px);
            padding: 6px 12px; border-radius: 8px;
            font-size: 12px; color: #f5f5f7;
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease; font-weight: 500;
        }
        .nav-dot:hover::before { opacity: 1; }
        .nav-dot:hover { background: rgba(255,255,255,0.35); transform: scale(1.4); }
        .nav-dot.active {
            background: #fff; transform: scale(1.2);
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        .nav-dot.video-dot { background: rgba(255,55,95,0.3); }
        .nav-dot.video-dot.active {
            background: #ff375f;
            box-shadow: 0 0 8px rgba(255,55,95,0.4);
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 2px;
            background: linear-gradient(90deg, #0a84ff, #5ac8fa);
            z-index: 1000;
            transition: width 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            opacity: 0;
        }
        .progress-bar.visible { opacity: 1; }

        .touch-area {
            position: fixed; inset: 0; z-index: 50;
            touch-action: none;
        }
        .touch-area.zoom-active { pointer-events: none; }

        .zoom-hint {
            display: none; position: fixed;
            bottom: 140px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,22,0.92);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            padding: 10px 20px; border-radius: 980px;
            color: rgba(255,255,255,0.65);
            font-size: 12px; font-weight: 500; z-index: 60;
            border: 1px solid rgba(255,255,255,0.08);
            animation: toastAnim 3.5s ease-in-out forwards;
            white-space: nowrap;
        }
        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(12px); }
            12% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
        }
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            .zoom-hint.visible { display: block; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stack-card.video-card .card-content {
                width: calc(100vw - 20px);
                height: calc(100dvh - 120px);
                border-radius: 16px;
            }
            .stack-card.video-card video { border-radius: 16px; }
            .video-overlay { border-radius: 16px; padding: 0 16px 44px; }
            .video-controls { border-radius: 0 0 16px 16px; padding: 10px 12px; }
            .stack-card.pdf-card canvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100dvh - 180px);
            }
            .nav-dots { right: 8px; gap: 5px; }
            .nav-dot { width: 5px; height: 5px; }
            .nav-dot::before { display: none; }
            .page-counter { padding: 7px 14px; font-size: 12px; }
            .page-counter .label { display: none; }
            .scroll-hint { bottom: 16px; }
            .top-btn { width: 34px; height: 34px; }
            .top-btn svg { width: 15px; height: 15px; }
        }

        @media (orientation: portrait) {
            .stack-card.video-card .card-content {
                width: calc(100vw - 16px);
                height: auto; aspect-ratio: 16/9;
                max-height: calc(100dvh - 200px);
            }
            .stack-card.pdf-card canvas {
                max-width: calc(100vw - 16px);
                max-height: calc(100dvh - 200px);
            }
            .stack-card.prev-1 { transform: translateY(-8px) scale(0.95); }
            .stack-card.prev-2 { transform: translateY(-16px) scale(0.90); }
            .stack-card.prev-3 { transform: translateY(-24px) scale(0.85); }
            .stack-card.next-1 { transform: translateY(8px) scale(0.95); }
            .stack-card.next-2 { transform: translateY(16px) scale(0.90); }
            .stack-card.next-3 { transform: translateY(24px) scale(0.85); }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .stack-card.video-card .card-content {
                height: calc(100dvh - 30px);
                width: auto; aspect-ratio: 16/9;
                max-width: calc(100vw - 80px);
            }
            .stack-card.pdf-card canvas { max-height: calc(100dvh - 50px); }
            .page-counter { bottom: 8px; padding: 5px 12px; font-size: 11px; }
            .nav-dots { gap: 3px; }
            .nav-dot { width: 4px; height: 4px; }
            .video-overlay { padding: 0 12px 36px; }
            .video-controls { padding: 8px 10px; }
            .scroll-hint { bottom: 10px; font-size: 9px; }
            .top-btn { width: 30px; height: 30px; top: 8px; }
            .fullscreen-btn { right: 8px; }
            .mute-btn { left: 8px; }
            .zoom-controls { bottom: 40px; }
        }

        /* Fullscreen - using class-based approach */
        .video-fullscreen {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            height: 100dvh !important;
            z-index: 99999 !important;
            border-radius: 0 !important;
            transform: none !important;
            opacity: 1 !important;
            filter: none !important;
            margin: 0 !important;
            padding: 0 !important;
            max-width: none !important;
            max-height: none !important;
            background: #000 !important;
        }
        .video-fullscreen .card-content {
            width: 100vw !important; height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important; max-height: none !important;
            border-radius: 0 !important;
        }
        .video-fullscreen video { border-radius: 0 !important; }
        .video-fullscreen .video-overlay {
            border-radius: 0 !important;
            padding: 0 24px 60px !important;
        }
        .video-fullscreen .video-controls {
            border-radius: 0 !important;
            padding: 16px 24px !important;
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)) !important;
        }
        .video-fullscreen .scroll-hint { display: none !important; }
        .video-fullscreen .fullscreen-btn {
            top: max(14px, env(safe-area-inset-top, 14px)) !important;
            right: max(14px, env(safe-area-inset-right, 14px)) !important;
        }
        .video-fullscreen .mute-btn {
            top: max(14px, env(safe-area-inset-top, 14px)) !important;
            left: max(14px, env(safe-area-inset-left, 14px)) !important;
        }

        /* Hide other UI in fullscreen */
        body.is-fullscreen .page-counter,
        body.is-fullscreen .nav-dots,
        body.is-fullscreen .progress-bar,
        body.is-fullscreen .zoom-controls,
        body.is-fullscreen .touch-area {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
    </div>

    <div class="progress-bar" id="progressBar"></div>
    <div class="nav-dots" id="navDots"></div>

    <div class="page-counter" id="pageCounter">
        <span class="label">Page</span>
        <span class="current">1</span>
        <span class="separator">/</span>
        <span class="total">1</span>
    </div>

    <div class="zoom-controls" id="zoomControls">
        <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">−</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="zoom-btn zoom-reset" id="zoomReset" aria-label="Reset zoom">Reset</button>
    </div>

    <div class="zoom-hint" id="zoomHint">Pinch to zoom · Double-tap to reset</div>

    <div class="upload-container" id="uploadContainer">
        <div class="upload-content">
            <h2>PDF Slideshow</h2>
            <p>Transform your document into a beautiful presentation</p>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <p>Drag and drop your PDF here</p>
                <input type="file" id="fileInput" accept=".pdf">
                <label for="fileInput" class="upload-btn">Choose File</label>
            </div>
            <div id="status"></div>
        </div>
    </div>

    <div class="slides-wrapper" id="slidesWrapper">
        <div class="page-stack" id="pageStack">
            <div class="stack-card video-card current" data-index="0" id="videoCard">
                <div class="card-content" id="cardContent">
                    <video id="mainVideo" autoplay muted loop playsinline preload="auto">
                        <source src="video1.mp4" type="video/mp4">
                    </video>
                    <div class="video-overlay" id="videoOverlay">
                        <h1 class="video-title"></h1>
                        <p class="video-subtitle"></p>
                    </div>

                    <div class="video-controls" id="videoControls">
                        <button class="video-btn" id="playPauseBtn" aria-label="Play/Pause">
                            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="#fff"/></svg>
                        </button>
                        <div class="video-progress-bar" id="videoProgressBar">
                            <div class="video-progress-fill" id="videoProgressFill"></div>
                        </div>
                        <span class="video-time" id="videoTime">0:00</span>
                        <button class="video-btn" id="muteBtn2" aria-label="Mute">
                            <svg viewBox="0 0 24 24" id="muteIcon2">
                                <path d="M11 5L6 9H2v6h4l5 4V5z" fill="#fff"/>
                                <line x1="23" y1="9" x2="17" y2="15" stroke="#fff" stroke-width="2"/>
                                <line x1="17" y1="9" x2="23" y2="15" stroke="#fff" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="scroll-hint" id="scrollHint">
                        <span>Scroll</span>
                        <div class="scroll-hint-arrow">
                            <svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
                        </div>
                    </div>

                    <button class="top-btn fullscreen-btn" id="fullscreenBtn" aria-label="Fullscreen">
                        <svg viewBox="0 0 24 24">
                            <polyline points="15 3 21 3 21 9"/>
                            <polyline points="9 21 3 21 3 15"/>
                            <line x1="21" y1="3" x2="14" y2="10"/>
                            <line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                    </button>

                    <button class="top-btn mute-btn" id="muteBtn" aria-label="Toggle sound">
                        <svg viewBox="0 0 24 24" id="muteIcon">
                            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                            <line x1="23" y1="9" x2="17" y2="15" stroke="#fff" stroke-width="2"/>
                            <line x1="17" y1="9" x2="23" y2="15" stroke="#fff" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="touch-area" id="touchArea"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            currentIndex: 0,
            totalCards: 1,
            isAnimating: false,
            isFullscreen: false,
            pdfDoc: null,
            renderedPages: new Map(),
            videoPlaying: true,
            videoMuted: true,
            controlsVisible: true,
            controlsTimer: null,
            zoom: {
                scale: 1, minScale: 1, maxScale: 5,
                translateX: 0, translateY: 0,
                isZoomed: false, isPinching: false,
                startDistance: 0, startScale: 1
            }
        };

        const el = {
            loader: document.getElementById('loader'),
            progressBar: document.getElementById('progressBar'),
            navDots: document.getElementById('navDots'),
            pageCounter: document.getElementById('pageCounter'),
            uploadContainer: document.getElementById('uploadContainer'),
            pageStack: document.getElementById('pageStack'),
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            status: document.getElementById('status'),
            touchArea: document.getElementById('touchArea'),
            video: document.getElementById('mainVideo'),
            videoCard: document.getElementById('videoCard'),
            cardContent: document.getElementById('cardContent'),
            fullscreenBtn: document.getElementById('fullscreenBtn'),
            muteBtn: document.getElementById('muteBtn'),
            muteIcon: document.getElementById('muteIcon'),
            muteBtn2: document.getElementById('muteBtn2'),
            muteIcon2: document.getElementById('muteIcon2'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            videoControls: document.getElementById('videoControls'),
            videoOverlay: document.getElementById('videoOverlay'),
            videoProgressBar: document.getElementById('videoProgressBar'),
            videoProgressFill: document.getElementById('videoProgressFill'),
            videoTime: document.getElementById('videoTime'),
            scrollHint: document.getElementById('scrollHint'),
            zoomControls: document.getElementById('zoomControls'),
            zoomLevel: document.getElementById('zoomLevel'),
            zoomIn: document.getElementById('zoomIn'),
            zoomOut: document.getElementById('zoomOut'),
            zoomReset: document.getElementById('zoomReset'),
            zoomHint: document.getElementById('zoomHint')
        };

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                         ('ontouchstart' in window && window.innerWidth < 1024);
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

        function getDistance(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        }
        function getMidpoint(t1, t2) {
            return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
        }
        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            return `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
        }

        function getContainerDimensions() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isShort = !isPortrait && window.innerHeight < 500;
            return {
                width: isPortrait ? window.innerWidth - 16 : (isShort ? window.innerWidth - 80 : window.innerWidth - 48),
                height: isPortrait ? window.innerHeight - 200 : (isShort ? window.innerHeight - 50 : window.innerHeight - 160)
            };
        }

        // SVG icon strings
        const icons = {
            muteOn: `<path d="M11 5L6 9H2v6h4l5 4V5z" fill="#fff"/><line x1="23" y1="9" x2="17" y2="15" stroke="#fff" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="#fff" stroke-width="2"/>`,
            muteOff: `<path d="M11 5L6 9H2v6h4l5 4V5z" fill="#fff"/><path d="M15.54 8.46a5 5 0 010 7.07" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M19.07 4.93a10 10 0 010 14.14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`,
            play: `<polygon points="5,3 19,12 5,21" fill="#fff"/>`,
            pause: `<rect x="6" y="4" width="4" height="16" fill="#fff"/><rect x="14" y="4" width="4" height="16" fill="#fff"/>`,
            fsEnter: `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`,
            fsExit: `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>`
        };

        // ─── Fullscreen (CSS class-based, works everywhere) ───
        function enterFullscreen() {
            if (state.isFullscreen) return;
            state.isFullscreen = true;

            // Try native Fullscreen API first
            const target = el.videoCard;
            const nativeFS = target.requestFullscreen || target.webkitRequestFullscreen || target.mozRequestFullScreen || target.msRequestFullscreen;

            if (nativeFS && !isIOS) {
                // Use native API on non-iOS
                nativeFS.call(target).then(() => {
                    applyFullscreenStyles();
                }).catch(() => {
                    // Fallback to CSS
                    applyFullscreenStyles();
                });
            } else if (isIOS && el.video.webkitEnterFullscreen) {
                // iOS Safari: use video native fullscreen
                el.video.webkitEnterFullscreen();
                state.isFullscreen = false; // iOS handles its own UI
                return;
            } else {
                // CSS fallback
                applyFullscreenStyles();
            }

            // Try orientation lock
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        function exitFullscreen() {
            if (!state.isFullscreen) return;
            state.isFullscreen = false;

            // Exit native fullscreen if active
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document).catch(() => {});
            }

            removeFullscreenStyles();

            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }

        function applyFullscreenStyles() {
            el.videoCard.classList.add('video-fullscreen');
            document.body.classList.add('is-fullscreen');
            el.fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24">${icons.fsExit}</svg>`;
            showVideoControls();
        }

        function removeFullscreenStyles() {
            el.videoCard.classList.remove('video-fullscreen');
            document.body.classList.remove('is-fullscreen');
            el.fullscreenBtn.innerHTML = `<svg viewBox="0 0 24 24">${icons.fsEnter}</svg>`;
        }

        function toggleFullscreen() {
            if (state.isFullscreen) exitFullscreen();
            else enterFullscreen();
        }

        // Listen for native fullscreen exit (e.g. pressing Escape)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && state.isFullscreen) {
                state.isFullscreen = false;
                removeFullscreenStyles();
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement && state.isFullscreen) {
                state.isFullscreen = false;
                removeFullscreenStyles();
                if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
            }
        });

        // Fullscreen button handler
        el.fullscreenBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            toggleFullscreen();
        });

        // Also handle touch specifically for mobile
        el.fullscreenBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            toggleFullscreen();
        }, { passive: false });

        // ─── Navigation Dots ───
        function createNavDots() {
            el.navDots.innerHTML = '';
            for (let i = 0; i < state.totalCards; i++) {
                const dot = document.createElement('div');
                const isVideo = i === 0;
                dot.className = `nav-dot ${isVideo ? 'video-dot' : ''} ${i === state.currentIndex ? 'active' : ''}`;
                dot.dataset.label = isVideo ? '▶ Video' : `Page ${i}`;
                dot.addEventListener('click', () => goToCard(i));
                el.navDots.appendChild(dot);
            }
        }

        // ─── Update UI ───
        function updateUI() {
            const dots = el.navDots.querySelectorAll('.nav-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === state.currentIndex));

            const progress = state.totalCards > 1 ? (state.currentIndex / (state.totalCards - 1)) * 100 : 0;
            el.progressBar.style.width = `${progress}%`;

            if (state.currentIndex > 0) {
                el.pageCounter.querySelector('.current').textContent = state.currentIndex;
                el.pageCounter.querySelector('.total').textContent = state.totalCards - 1;
            } else {
                el.pageCounter.querySelector('.current').textContent = '▶';
                el.pageCounter.querySelector('.total').textContent = state.totalCards - 1;
            }

            el.zoomControls.classList.toggle('visible', state.currentIndex > 0 && isMobile);

            if (el.scrollHint) {
                el.scrollHint.style.display = state.currentIndex === 0 && state.totalCards > 1 ? 'flex' : 'none';
            }

            updateCardStack();
        }

        function updateCardStack() {
            const cards = el.pageStack.querySelectorAll('.stack-card');
            const cls = ['prev-4','prev-3','prev-2','prev-1','current','next-1','next-2','next-3','next-4','hidden-above','hidden-below'];

            cards.forEach(card => {
                const idx = parseInt(card.dataset.index);
                const diff = idx - state.currentIndex;
                cls.forEach(c => card.classList.remove(c));

                if (diff === 0) card.classList.add('current');
                else if (diff === -1) card.classList.add('prev-1');
                else if (diff === -2) card.classList.add('prev-2');
                else if (diff === -3) card.classList.add('prev-3');
                else if (diff <= -4) card.classList.add('hidden-above');
                else if (diff === 1) card.classList.add('next-1');
                else if (diff === 2) card.classList.add('next-2');
                else if (diff === 3) card.classList.add('next-3');
                else card.classList.add('hidden-below');
            });

            if (state.currentIndex === 0) {
                el.video?.play().catch(() => {});
                state.videoPlaying = true;
            } else {
                el.video?.pause();
                state.videoPlaying = false;
            }
            updatePlayPauseIcon();
        }

        // ─── Zoom ───
        function resetZoom() {
            state.zoom.scale = 1;
            state.zoom.translateX = 0;
            state.zoom.translateY = 0;
            state.zoom.isZoomed = false;
            state.zoom.isPinching = false;
            el.zoomLevel.textContent = '100%';
            el.touchArea.classList.remove('zoom-active');
            document.querySelectorAll('.pdf-zoom-wrapper').forEach(w => {
                w.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
                w.style.transform = 'scale(1) translate(0px, 0px)';
                setTimeout(() => { w.style.transition = ''; }, 300);
            });
        }

        function applyZoom() {
            const wrapper = document.querySelector(`.stack-card[data-index="${state.currentIndex}"] .pdf-zoom-wrapper`);
            if (!wrapper) return;
            if (state.zoom.scale <= 1) {
                state.zoom.translateX = 0;
                state.zoom.translateY = 0;
            } else {
                const maxTX = (state.zoom.scale - 1) * wrapper.offsetWidth / 2;
                const maxTY = (state.zoom.scale - 1) * wrapper.offsetHeight / 2;
                state.zoom.translateX = clamp(state.zoom.translateX, -maxTX, maxTX);
                state.zoom.translateY = clamp(state.zoom.translateY, -maxTY, maxTY);
            }
            wrapper.style.transform = `scale(${state.zoom.scale}) translate(${state.zoom.translateX / state.zoom.scale}px, ${state.zoom.translateY / state.zoom.scale}px)`;
            el.zoomLevel.textContent = `${Math.round(state.zoom.scale * 100)}%`;
            state.zoom.isZoomed = state.zoom.scale > 1.05;
            el.touchArea.classList.toggle('zoom-active', state.zoom.isZoomed);
        }

        // ─── Navigate ───
        function goToCard(index) {
            if (state.isAnimating || state.isFullscreen) return;
            if (index < 0 || index >= state.totalCards || index === state.currentIndex) return;
            resetZoom();
            state.isAnimating = true;
            state.currentIndex = index;
            updateUI();
            if (state.pdfDoc) {
                const pages = index === 0 ? [1, 2] : [index - 1, index, index + 1, index + 2];
                pages.forEach(p => renderPage(p));
            }
            setTimeout(() => { state.isAnimating = false; }, 550);
        }

        // ─── Render PDF ───
        async function renderPage(pageNum) {
            if (!state.pdfDoc || pageNum < 1 || pageNum > state.pdfDoc.numPages) return;
            const container = getContainerDimensions();
            const cacheKey = `${pageNum}-${container.width}-${container.height}-${window.devicePixelRatio}`;
            if (state.renderedPages.get(pageNum) === cacheKey) return;

            try {
                const page = await state.pdfDoc.getPage(pageNum);
                const card = el.pageStack.querySelector(`.stack-card[data-index="${pageNum}"]`);
                if (!card) return;

                let zc = card.querySelector('.pdf-zoom-container');
                if (!zc) {
                    zc = document.createElement('div');
                    zc.className = 'pdf-zoom-container';
                    const zw = document.createElement('div');
                    zw.className = 'pdf-zoom-wrapper';
                    zc.appendChild(zw);
                    card.appendChild(zc);
                }
                const zw = card.querySelector('.pdf-zoom-wrapper');
                let canvas = zw.querySelector('canvas');
                if (!canvas) { canvas = document.createElement('canvas'); zw.appendChild(canvas); }

                const ctx = canvas.getContext('2d');
                const vp = page.getViewport({ scale: 1 });
                const scale = Math.min(container.width / vp.width, container.height / vp.height);
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const svp = page.getViewport({ scale: scale * dpr });

                canvas.width = svp.width;
                canvas.height = svp.height;
                canvas.style.width = `${svp.width / dpr}px`;
                canvas.style.height = `${svp.height / dpr}px`;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                await page.render({ canvasContext: ctx, viewport: svp }).promise;
                state.renderedPages.set(pageNum, cacheKey);

                if (isMobile) setupPinchZoom(zc, zw);
            } catch (err) {
                console.error('Render error page', pageNum, err);
            }
        }

        // ─── Pinch Zoom for PDF ───
        function setupPinchZoom(container, wrapper) {
            if (container._zoomSetup) return;
            container._zoomSetup = true;
            let lastTap = 0, isPanning = false;
            let panStartX = 0, panStartY = 0, panTX = 0, panTY = 0;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault(); e.stopPropagation();
                    state.zoom.isPinching = true;
                    state.zoom.startDistance = getDistance(e.touches[0], e.touches[1]);
                    state.zoom.startScale = state.zoom.scale;
                } else if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        e.preventDefault();
                        if (state.zoom.isZoomed) resetZoom();
                        else { state.zoom.scale = 2.5; state.zoom.translateX = 0; state.zoom.translateY = 0; applyZoom(); }
                        lastTap = 0; return;
                    }
                    lastTap = now;
                    if (state.zoom.isZoomed) {
                        isPanning = true;
                        panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
                        panTX = state.zoom.translateX; panTY = state.zoom.translateY;
                        wrapper.style.transition = 'none';
                    }
                }
            }, { passive: false });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && state.zoom.isPinching) {
                    e.preventDefault(); e.stopPropagation();
                    const dist = getDistance(e.touches[0], e.touches[1]);
                    state.zoom.scale = clamp(state.zoom.startScale * (dist / state.zoom.startDistance), state.zoom.minScale, state.zoom.maxScale);
                    wrapper.style.transition = 'none';
                    applyZoom();
                } else if (e.touches.length === 1 && isPanning && state.zoom.isZoomed) {
                    e.preventDefault(); e.stopPropagation();
                    state.zoom.translateX = panTX + (e.touches[0].clientX - panStartX);
                    state.zoom.translateY = panTY + (e.touches[0].clientY - panStartY);
                    applyZoom();
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (state.zoom.isPinching && e.touches.length < 2) {
                    state.zoom.isPinching = false;
                    wrapper.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
                    if (state.zoom.scale < 1.08) resetZoom();
                    setTimeout(() => { wrapper.style.transition = ''; }, 300);
                }
                if (e.touches.length === 0) isPanning = false;
            });
        }

        // ─── Video Controls ───
        function updatePlayPauseIcon() {
            el.playPauseBtn.innerHTML = `<svg viewBox="0 0 24 24">${state.videoPlaying ? icons.pause : icons.play}</svg>`;
        }
        function updateMuteIcons() {
            const svg = state.videoMuted ? icons.muteOn : icons.muteOff;
            el.muteIcon.innerHTML = svg;
            el.muteIcon2.innerHTML = svg;
        }

        el.playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.videoPlaying) { el.video.pause(); state.videoPlaying = false; }
            else { el.video.play().catch(() => {}); state.videoPlaying = true; }
            updatePlayPauseIcon();
            showVideoControls();
        });

        function toggleMute(e) {
            e.stopPropagation();
            state.videoMuted = !state.videoMuted;
            el.video.muted = state.videoMuted;
            updateMuteIcons();
        }
        el.muteBtn.addEventListener('click', toggleMute);
        el.muteBtn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); toggleMute(e); }, { passive: false });
        el.muteBtn2.addEventListener('click', toggleMute);

        el.video.addEventListener('timeupdate', () => {
            if (el.video.duration) {
                el.videoProgressFill.style.width = `${(el.video.currentTime / el.video.duration) * 100}%`;
                el.videoTime.textContent = formatTime(el.video.duration - el.video.currentTime);
            }
        });

        el.videoProgressBar.addEventListener('click', (e) => {
            e.stopPropagation();
            const r = el.videoProgressBar.getBoundingClientRect();
            el.video.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * el.video.duration;
        });

        let isScrubbing = false;
        el.videoProgressBar.addEventListener('touchstart', (e) => {
            e.stopPropagation(); isScrubbing = true;
            const r = el.videoProgressBar.getBoundingClientRect();
            el.video.currentTime = clamp((e.touches[0].clientX - r.left) / r.width, 0, 1) * el.video.duration;
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
            if (!isScrubbing) return;
            const r = el.videoProgressBar.getBoundingClientRect();
            el.video.currentTime = clamp((e.touches[0].clientX - r.left) / r.width, 0, 1) * el.video.duration;
        }, { passive: true });
        document.addEventListener('touchend', () => { isScrubbing = false; });

        function showVideoControls() {
            state.controlsVisible = true;
            el.videoControls.classList.remove('hidden-controls');
            el.videoOverlay.classList.remove('hidden-overlay');
            clearTimeout(state.controlsTimer);
            state.controlsTimer = setTimeout(() => {
                if (state.videoPlaying && state.currentIndex === 0) {
                    el.videoControls.classList.add('hidden-controls');
                    el.videoOverlay.classList.add('hidden-overlay');
                    state.controlsVisible = false;
                }
            }, 3500);
        }

        el.cardContent.addEventListener('click', (e) => {
            if (e.target.closest('.video-controls') || e.target.closest('.top-btn')) return;
            if (state.controlsVisible) {
                el.videoControls.classList.add('hidden-controls');
                el.videoOverlay.classList.add('hidden-overlay');
                state.controlsVisible = false;
                clearTimeout(state.controlsTimer);
            } else {
                showVideoControls();
            }
        });

        showVideoControls();

        // ─── Zoom Controls ───
        el.zoomIn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.currentIndex > 0) {
                state.zoom.scale = clamp(state.zoom.scale + 0.5, 1, state.zoom.maxScale);
                applyZoom();
            }
        });
        el.zoomOut.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.currentIndex > 0) {
                state.zoom.scale = clamp(state.zoom.scale - 0.5, 1, state.zoom.maxScale);
                if (state.zoom.scale <= 1.05) resetZoom(); else applyZoom();
            }
        });
        el.zoomReset.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(); });

        // ─── Touch Navigation ───
        let touchStartY = 0, touchStartX = 0, touchStartTime = 0, touchMoved = false;

        el.touchArea.addEventListener('touchstart', (e) => {
            if (state.zoom.isZoomed || state.zoom.isPinching || state.isFullscreen) return;
            if (e.touches.length !== 1) return;
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            touchStartTime = Date.now();
            touchMoved = false;
        }, { passive: true });

        el.touchArea.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });

        el.touchArea.addEventListener('touchend', (e) => {
            if (state.zoom.isZoomed || state.zoom.isPinching || state.isFullscreen) return;
            if (!touchMoved) return;
            const diffY = touchStartY - e.changedTouches[0].clientY;
            const diffX = touchStartX - e.changedTouches[0].clientX;
            const elapsed = Date.now() - touchStartTime;
            if (Math.abs(diffY) > Math.abs(diffX) * 1.2) {
                const threshold = elapsed < 250 ? 30 : 60;
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) goToCard(state.currentIndex + 1);
                    else goToCard(state.currentIndex - 1);
                }
            }
        }, { passive: true });

        // ─── Mouse Wheel ───
        let wheelTimer, wheelAcc = 0;
        document.addEventListener('wheel', (e) => {
            if (state.zoom.isZoomed || state.isFullscreen) return;
            wheelAcc += e.deltaY;
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => {
                if (wheelAcc > 40) goToCard(state.currentIndex + 1);
                else if (wheelAcc < -40) goToCard(state.currentIndex - 1);
                wheelAcc = 0;
            }, 60);
        }, { passive: true });

        // ─── Keyboard ───
        document.addEventListener('keydown', (e) => {
            if (state.isFullscreen && e.key === 'Escape') { exitFullscreen(); return; }
            switch (e.key) {
                case 'ArrowDown': case 'ArrowRight': case 'PageDown': case ' ':
                    if (!state.zoom.isZoomed && !state.isFullscreen) { e.preventDefault(); goToCard(state.currentIndex + 1); } break;
                case 'ArrowUp': case 'ArrowLeft': case 'PageUp':
                    if (!state.zoom.isZoomed && !state.isFullscreen) { e.preventDefault(); goToCard(state.currentIndex - 1); } break;
                case 'Home': e.preventDefault(); goToCard(0); break;
                case 'End': e.preventDefault(); goToCard(state.totalCards - 1); break;
                case 'Escape': if (state.zoom.isZoomed) resetZoom(); break;
                case 'f': case 'F': toggleFullscreen(); break;
                case '+': case '=':
                    if (state.currentIndex > 0) { state.zoom.scale = clamp(state.zoom.scale + 0.25, 1, state.zoom.maxScale); applyZoom(); } break;
                case '-':
                    if (state.currentIndex > 0) { state.zoom.scale = clamp(state.zoom.scale - 0.25, 1, state.zoom.maxScale); if (state.zoom.scale <= 1.05) resetZoom(); else applyZoom(); } break;
                case '0': resetZoom(); break;
                case 'm': case 'M':
                    state.videoMuted = !state.videoMuted; el.video.muted = state.videoMuted; updateMuteIcons(); break;
                case 'k': case 'K':
                    if (state.currentIndex === 0) {
                        if (state.videoPlaying) el.video.pause(); else el.video.play().catch(() => {});
                        state.videoPlaying = !state.videoPlaying; updatePlayPauseIcon();
                    } break;
            }
        });

        // ─── File Upload ───
        el.uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); el.uploadArea.classList.add('drag-over'); });
        el.uploadArea.addEventListener('dragleave', () => { el.uploadArea.classList.remove('drag-over'); });
        el.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault(); el.uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file?.type === 'application/pdf') loadPDFFromFile(file);
        });
        el.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPDFFromFile(file);
        });
        function loadPDFFromFile(file) {
            const reader = new FileReader();
            reader.onload = () => { loadPDF({ data: new Uint8Array(reader.result) }); };
            reader.readAsArrayBuffer(file);
        }
        function showStatus(msg, type) { el.status.className = `status ${type}`; el.status.textContent = msg; }
        function hideStatus() { el.status.className = 'status'; el.status.textContent = ''; }

        // ─── Load PDF ───
        async function loadPDF(source) {
            showStatus('Loading PDF...', 'loading');
            try {
                state.pdfDoc = await pdfjsLib.getDocument(source).promise;
                const numPages = state.pdfDoc.numPages;
                el.uploadContainer.classList.add('hidden');

                for (let i = 1; i <= numPages; i++) {
                    const card = document.createElement('div');
                    card.className = 'stack-card pdf-card hidden-below';
                    card.dataset.index = i;
                    el.pageStack.appendChild(card);
                }

                state.totalCards = numPages + 1;
                el.navDots.classList.add('visible');
                el.pageCounter.classList.add('visible');
                el.progressBar.classList.add('visible');
                createNavDots(); updateUI();

                await renderPage(1); renderPage(2); renderPage(3);
                hideStatus();

                if (isMobile) {
                    setTimeout(() => {
                        el.zoomHint.classList.add('visible');
                        setTimeout(() => el.zoomHint.classList.remove('visible'), 3800);
                    }, 1500);
                }
            } catch (err) {
                console.error('PDF load error:', err);
                showStatus('Error loading PDF. Please try again.', 'error');
            }
        }

        // ─── Resize ───
        let resizeTimer;
        const handleResize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear(); resetZoom();
                    [state.currentIndex - 1, state.currentIndex, state.currentIndex + 1, state.currentIndex + 2].forEach(p => renderPage(p));
                }
            }, 200);
        };
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => setTimeout(handleResize, 350));

        // ─── Prevent browser gestures ───
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

        // ─── Init ───
        window.addEventListener('load', () => {
            setTimeout(() => el.loader.classList.add('hidden'), 400);
            el.video.addEventListener('error', () => console.log('Video could not be loaded'));
            showVideoControls();
            loadPDF('pdf1.pdf').catch(() => console.log('Auto-load failed, showing upload UI'));
        });
    </script>
</body>
</html>
