<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PDF Slideshow</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Apple Pro Space Grey gradient */
            background: linear-gradient(180deg, #1d1d1f 0%, #161617 50%, #0d0d0d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        /* Loader */
        .loader {
            position: fixed;
            inset: 0;
            background: #1d1d1f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-ring {
            width: 44px;
            height: 44px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader-text {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Main Container */
        .slides-wrapper {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Page Stack Container */
        .page-stack {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Individual Page */
        .page-card {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity, filter;
        }

        .page-card canvas {
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 140px);
            max-height: calc(100dvh - 140px);
            width: auto;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        }

        /* Previous pages - stacked behind, greyed */
        .page-card.prev-3 {
            transform: translateY(-18px) scale(0.88);
            opacity: 0.15;
            filter: grayscale(100%) brightness(0.4);
            z-index: 1;
        }

        .page-card.prev-2 {
            transform: translateY(-12px) scale(0.92);
            opacity: 0.25;
            filter: grayscale(100%) brightness(0.5);
            z-index: 2;
        }

        .page-card.prev-1 {
            transform: translateY(-6px) scale(0.96);
            opacity: 0.4;
            filter: grayscale(100%) brightness(0.6);
            z-index: 3;
        }

        /* Current page - full visibility */
        .page-card.current {
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: none;
            z-index: 10;
        }

        /* Next pages - stacked below, greyed */
        .page-card.next-1 {
            transform: translateY(6px) scale(0.96);
            opacity: 0.4;
            filter: grayscale(100%) brightness(0.6);
            z-index: 3;
        }

        .page-card.next-2 {
            transform: translateY(12px) scale(0.92);
            opacity: 0.25;
            filter: grayscale(100%) brightness(0.5);
            z-index: 2;
        }

        .page-card.next-3 {
            transform: translateY(18px) scale(0.88);
            opacity: 0.15;
            filter: grayscale(100%) brightness(0.4);
            z-index: 1;
        }

        /* Hidden pages */
        .page-card.hidden-above {
            transform: translateY(-100px) scale(0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .page-card.hidden-below {
            transform: translateY(100px) scale(0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Video Slide */
        .video-container {
            position: absolute;
            inset: 0;
            z-index: 5;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .video-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(29,29,31,0.4), 
                rgba(29,29,31,0.1) 40%,
                rgba(29,29,31,0.1) 60%,
                rgba(29,29,31,0.7));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .video-title {
            color: #fff;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .scroll-hint {
            position: absolute;
            bottom: max(40px, env(safe-area-inset-bottom, 40px));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .scroll-hint::after {
            content: '';
            width: 20px;
            height: 20px;
            border-right: 1.5px solid rgba(255,255,255,0.5);
            border-bottom: 1.5px solid rgba(255,255,255,0.5);
            transform: rotate(45deg);
            animation: scrollBounce 2s ease-in-out infinite;
        }

        @keyframes scrollBounce {
            0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.5; }
            50% { transform: rotate(45deg) translateY(5px); opacity: 1; }
        }

        /* Upload Container */
        .upload-container {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .upload-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .upload-content {
            max-width: 380px;
            width: 100%;
            text-align: center;
            color: #fff;
        }

        .upload-content h2 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #f5f5f7;
        }

        .upload-content > p {
            color: #86868b;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .upload-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 48px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-area p {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin-top: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
        }

        .status.loading {
            background: rgba(255,255,255,0.05);
            color: #f5f5f7;
        }

        .status.error {
            background: rgba(255,59,48,0.15);
            color: #ff453a;
        }

        /* Page Counter - Apple style */
        .page-counter {
            position: fixed;
            bottom: max(24px, env(safe-area-inset-bottom, 24px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28,28,30,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 980px;
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .page-counter.visible {
            opacity: 1;
        }

        .page-counter .current {
            color: #fff;
        }

        .page-counter .separator {
            color: #48484a;
            margin: 0 6px;
        }

        .page-counter .total {
            color: #86868b;
        }

        /* Navigation Dots */
        .nav-dots {
            position: fixed;
            right: max(16px, env(safe-area-inset-right, 16px));
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-dots.visible {
            opacity: 1;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.2);
        }

        .nav-dot.active {
            background: #fff;
        }

        /* Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #0071e3, #5ac8fa);
            z-index: 1000;
            transition: width 0.4s ease;
            opacity: 0;
        }

        .progress-bar.visible {
            opacity: 1;
        }

        /* Touch Area */
        .touch-area {
            position: fixed;
            inset: 0;
            z-index: 50;
            touch-action: pan-y;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .page-card canvas {
                max-width: calc(100vw - 24px);
                max-height: calc(100vh - 120px);
                max-height: calc(100dvh - 120px);
                border-radius: 6px;
            }

            .nav-dots {
                right: 10px;
                gap: 6px;
            }

            .nav-dot {
                width: 6px;
                height: 6px;
            }

            .page-counter {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        @media (orientation: portrait) {
            .page-card canvas {
                max-width: calc(100vw - 20px);
                max-height: calc(100vh - 160px);
                max-height: calc(100dvh - 160px);
            }

            /* Adjust stack for portrait */
            .page-card.prev-1 { transform: translateY(-8px) scale(0.95); }
            .page-card.prev-2 { transform: translateY(-16px) scale(0.90); }
            .page-card.prev-3 { transform: translateY(-24px) scale(0.85); }
            .page-card.next-1 { transform: translateY(8px) scale(0.95); }
            .page-card.next-2 { transform: translateY(16px) scale(0.90); }
            .page-card.next-3 { transform: translateY(24px) scale(0.85); }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .page-card canvas {
                max-height: calc(100vh - 80px);
                max-height: calc(100dvh - 80px);
            }

            .page-counter {
                bottom: 12px;
                padding: 6px 14px;
                font-size: 12px;
            }

            .nav-dots {
                gap: 4px;
            }

            .nav-dot {
                width: 5px;
                height: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Navigation Dots -->
    <div class="nav-dots" id="navDots"></div>

    <!-- Page Counter -->
    <div class="page-counter" id="pageCounter">
        <span class="current">1</span>
        <span class="separator">/</span>
        <span class="total">1</span>
    </div>

    <!-- Main Container -->
    <div class="slides-wrapper" id="slidesWrapper">
        <!-- Video Container -->
        <div class="video-container" id="videoContainer">
            <video autoplay muted loop playsinline>
                <source src="video1.mp4" type="video/mp4">
            </video>
            <div class="video-overlay">
                <h1 class="video-title"></h1>
                <div class="scroll-hint">Scroll to explore</div>
            </div>
        </div>

        <!-- Upload Container -->
        <div class="upload-container" id="uploadContainer">
            <div class="upload-content">
                <h2>Upload PDF</h2>
                <p>Transform your document into a beautiful presentation</p>
                
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <p>Drag and drop your PDF here</p>
                    <input type="file" id="fileInput" accept=".pdf">
                    <label for="fileInput" class="upload-btn">Choose File</label>
                </div>
                
                <div id="status"></div>
            </div>
        </div>

        <!-- Page Stack -->
        <div class="page-stack" id="pageStack"></div>
    </div>

    <!-- Touch Area -->
    <div class="touch-area" id="touchArea"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            currentPage: 0, // 0 = video, 1+ = PDF pages
            totalPages: 0,
            isAnimating: false,
            pdfDoc: null,
            renderedPages: new Map(),
            showingVideo: true
        };

        const elements = {
            loader: document.getElementById('loader'),
            progressBar: document.getElementById('progressBar'),
            navDots: document.getElementById('navDots'),
            pageCounter: document.getElementById('pageCounter'),
            videoContainer: document.getElementById('videoContainer'),
            uploadContainer: document.getElementById('uploadContainer'),
            pageStack: document.getElementById('pageStack'),
            uploadArea: document.getElementById('uploadArea'),
            fileInput: document.getElementById('fileInput'),
            status: document.getElementById('status'),
            touchArea: document.getElementById('touchArea')
        };

        // Get container dimensions for PDF rendering
        function getContainerDimensions() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isShortLandscape = !isPortrait && window.innerHeight < 500;
            
            let maxWidth, maxHeight;
            
            if (isPortrait) {
                maxWidth = window.innerWidth - 20;
                maxHeight = window.innerHeight - 160;
            } else if (isShortLandscape) {
                maxWidth = window.innerWidth - 40;
                maxHeight = window.innerHeight - 80;
            } else {
                maxWidth = window.innerWidth - 40;
                maxHeight = window.innerHeight - 140;
            }
            
            return { width: maxWidth, height: maxHeight, isPortrait };
        }

        // Create navigation dots
        function createNavDots() {
            elements.navDots.innerHTML = '';
            const total = state.totalPages + 1; // +1 for video
            
            for (let i = 0; i <= state.totalPages; i++) {
                const dot = document.createElement('div');
                dot.className = `nav-dot ${i === state.currentPage ? 'active' : ''}`;
                dot.onclick = () => goToPage(i);
                elements.navDots.appendChild(dot);
            }
        }

        // Update UI
        function updateUI() {
            // Update nav dots
            const dots = elements.navDots.querySelectorAll('.nav-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === state.currentPage);
            });

            // Update progress bar
            const progress = state.totalPages > 0 ? 
                (state.currentPage / state.totalPages) * 100 : 0;
            elements.progressBar.style.width = `${progress}%`;

            // Update page counter
            if (state.currentPage > 0) {
                elements.pageCounter.querySelector('.current').textContent = state.currentPage;
                elements.pageCounter.querySelector('.total').textContent = state.totalPages;
            }

            // Update page stack positions
            updatePageStack();
        }

        // Update page stack visual positions
        function updatePageStack() {
            const pages = elements.pageStack.querySelectorAll('.page-card');
            
            pages.forEach((page, index) => {
                const pageNum = index + 1;
                const diff = pageNum - state.currentPage;
                
                // Remove all position classes
                page.classList.remove(
                    'prev-3', 'prev-2', 'prev-1', 
                    'current', 
                    'next-1', 'next-2', 'next-3',
                    'hidden-above', 'hidden-below'
                );
                
                // Add appropriate class based on position
                if (diff === 0) {
                    page.classList.add('current');
                } else if (diff === -1) {
                    page.classList.add('prev-1');
                } else if (diff === -2) {
                    page.classList.add('prev-2');
                } else if (diff === -3) {
                    page.classList.add('prev-3');
                } else if (diff < -3) {
                    page.classList.add('hidden-above');
                } else if (diff === 1) {
                    page.classList.add('next-1');
                } else if (diff === 2) {
                    page.classList.add('next-2');
                } else if (diff === 3) {
                    page.classList.add('next-3');
                } else {
                    page.classList.add('hidden-below');
                }
            });
        }

        // Navigate to page
        function goToPage(pageNum) {
            if (state.isAnimating) return;
            if (pageNum < 0 || pageNum > state.totalPages) return;
            if (pageNum === state.currentPage) return;

            state.isAnimating = true;

            // Handle video visibility
            if (pageNum === 0) {
                elements.videoContainer.classList.remove('hidden');
                state.showingVideo = true;
            } else {
                elements.videoContainer.classList.add('hidden');
                state.showingVideo = false;
            }

            state.currentPage = pageNum;
            updateUI();

            // Render adjacent pages
            if (state.pdfDoc && pageNum > 0) {
                renderPage(pageNum);
                renderPage(pageNum + 1);
                renderPage(pageNum + 2);
                renderPage(pageNum - 1);
            }

            setTimeout(() => {
                state.isAnimating = false;
            }, 600);
        }

        // Render PDF page
        async function renderPage(pageNum) {
            if (!state.pdfDoc) return;
            if (pageNum < 1 || pageNum > state.pdfDoc.numPages) return;

            const container = getContainerDimensions();
            const cacheKey = `${pageNum}-${container.width}-${container.height}`;
            
            if (state.renderedPages.get(pageNum) === cacheKey) return;

            try {
                const page = await state.pdfDoc.getPage(pageNum);
                const pageCard = elements.pageStack.querySelector(`.page-card[data-page="${pageNum}"]`);
                
                if (!pageCard) return;

                let canvas = pageCard.querySelector('canvas');
                if (!canvas) {
                    canvas = document.createElement('canvas');
                    pageCard.appendChild(canvas);
                }

                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1 });
                
                // Calculate scale to fit container while maintaining aspect ratio
                const scaleX = container.width / viewport.width;
                const scaleY = container.height / viewport.height;
                const scale = Math.min(scaleX, scaleY);
                
                // Device pixel ratio for sharpness
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const renderScale = scale * dpr;
                
                const scaledViewport = page.getViewport({ scale: renderScale });
                
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                canvas.style.width = `${scaledViewport.width / dpr}px`;
                canvas.style.height = `${scaledViewport.height / dpr}px`;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                await page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise;

                state.renderedPages.set(pageNum, cacheKey);

            } catch (error) {
                console.error('Error rendering page:', pageNum, error);
            }
        }

        // Load PDF
        async function loadPDF(source) {
            showStatus('Loading PDF...', 'loading');

            try {
                state.pdfDoc = await pdfjsLib.getDocument(source).promise;
                state.totalPages = state.pdfDoc.numPages;

                // Hide upload container
                elements.uploadContainer.classList.add('hidden');

                // Create page cards
                elements.pageStack.innerHTML = '';
                for (let i = 1; i <= state.totalPages; i++) {
                    const pageCard = document.createElement('div');
                    pageCard.className = 'page-card hidden-below';
                    pageCard.dataset.page = i;
                    elements.pageStack.appendChild(pageCard);
                }

                // Show UI elements
                elements.navDots.classList.add('visible');
                elements.pageCounter.classList.add('visible');
                elements.progressBar.classList.add('visible');

                createNavDots();
                updateUI();

                // Render first few pages
                await renderPage(1);
                renderPage(2);
                renderPage(3);

                hideStatus();

            } catch (error) {
                console.error('PDF load error:', error);
                showStatus('Error loading PDF', 'error');
            }
        }

        // Status messages
        function showStatus(msg, type) {
            elements.status.className = `status ${type}`;
            elements.status.textContent = msg;
            elements.status.style.display = 'block';
        }

        function hideStatus() {
            elements.status.style.display = 'none';
        }

        // Touch handling
        let touchStartY = 0;
        let touchStartTime = 0;

        elements.touchArea.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        elements.touchArea.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            const time = Date.now() - touchStartTime;

            if (Math.abs(diff) > 50 || (Math.abs(diff) > 30 && time < 300)) {
                if (diff > 0) {
                    goToPage(state.currentPage + 1);
                } else {
                    goToPage(state.currentPage - 1);
                }
            }
        }, { passive: true });

        // Mouse wheel
        let wheelTimer;
        document.addEventListener('wheel', (e) => {
            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => {
                if (e.deltaY > 30) {
                    goToPage(state.currentPage + 1);
                } else if (e.deltaY < -30) {
                    goToPage(state.currentPage - 1);
                }
            }, 50);
        }, { passive: true });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowDown':
                case 'ArrowRight':
                case 'PageDown':
                case ' ':
                    e.preventDefault();
                    goToPage(state.currentPage + 1);
                    break;
                case 'ArrowUp':
                case 'ArrowLeft':
                case 'PageUp':
                    e.preventDefault();
                    goToPage(state.currentPage - 1);
                    break;
                case 'Home':
                    e.preventDefault();
                    goToPage(0);
                    break;
                case 'End':
                    e.preventDefault();
                    goToPage(state.totalPages);
                    break;
                case 'f':
                case 'F':
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen?.();
                    } else {
                        document.exitFullscreen?.();
                    }
                    break;
            }
        });

        // File upload
        elements.uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.add('drag-over');
        });

        elements.uploadArea.addEventListener('dragleave', () => {
            elements.uploadArea.classList.remove('drag-over');
        });

        elements.uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            elements.uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file?.type === 'application/pdf') {
                loadPDFFromFile(file);
            }
        });

        elements.fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadPDFFromFile(file);
        });

        function loadPDFFromFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                loadPDF({ data: new Uint8Array(reader.result) });
            };
            reader.readAsArrayBuffer(file);
        }

        // Handle resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear();
                    renderPage(state.currentPage);
                    renderPage(state.currentPage + 1);
                    renderPage(state.currentPage - 1);
                }
            }, 150);
        });

        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (state.pdfDoc) {
                    state.renderedPages.clear();
                    renderPage(state.currentPage);
                    renderPage(state.currentPage + 1);
                    renderPage(state.currentPage - 1);
                }
            }, 300);
        });

        // Initialize
        window.addEventListener('load', () => {
            setTimeout(() => {
                elements.loader.classList.add('hidden');
            }, 500);

            // Try auto-load PDF
            loadPDF('pdf1.pdf').catch(() => {
                console.log('Auto-load failed, showing upload UI');
            });
        });
    </script>
</body>
</html>
